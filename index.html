<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Le Sablier Brisé : roguelite souls-like en 3D dans le navigateur.">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}</style>
</head>
<body>
<title>Le Sablier Brisé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: une colonne étroite façon console ; gestion du perso entre les combats, arène temps réel pendant. Givre et braise, sombre par choix (thème unique). */
:root{
  color-scheme: dark;
  --bg:#111418; --well:#0a0c0f; --panel:#181d23; --panel2:#1f252d; --line:#2c343d;
  --bone:#e3d9c5; --dim:#8f969d; --ember:#d89b47; --blood:#c4483d; --frost:#9fc7d9; --ok:#86b57c;
  --terre:#b98b58; --feu:#e26b43; --air:#88ba76; --eau:#63a0d6;
  --f-disp:"IM Fell English SC","Cormorant SC",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.45}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px;display:flex;flex-direction:column;gap:16px}
#app.fightmode{gap:8px;padding-block:10px 16px;user-select:none;-webkit-user-select:none}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.dim{color:var(--dim)}
.btn{background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:3px;color:var(--bone);text-align:center}
.btn:hover:not(:disabled){border-color:var(--dim)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{border-color:var(--ember);color:var(--ember);background:color-mix(in srgb,var(--ember) 9%,var(--panel2))}
.btn.danger{border-color:var(--blood);color:var(--blood)}
.btn.big{width:100%;padding:14px;font-family:var(--f-disp);font-size:21px;letter-spacing:.04em}
.btn.sm{padding:5px 9px;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar{height:10px;background:var(--well);border:1px solid var(--line);position:relative;overflow:hidden;border-radius:2px}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--blood)}
.bar i.sh{background:var(--frost);opacity:.55}
.bar.ember i{background:var(--ember)}
.bar.stam{height:6px}
.bar.stam i{background:var(--ok)}
.bar.mana{height:6px;margin-top:3px}
.bar.mana i{background:#5b8cff}
.bdg{position:relative;display:inline-flex;flex-shrink:0;align-items:center;gap:6px;font-size:13.5px;padding:4px 10px 6px 4px;border-radius:6px;background:rgba(10,12,16,.82);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-shadow:0 1px 2px #000}
.bdg i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:4px;font-size:14px}
.bdg b{position:absolute;left:0;bottom:0;height:3px;background:currentColor;opacity:.8;transition:width .2s linear}
.bdg.bad{color:#ff8a7a;border-color:#a8433a}.bdg.bad i{background:#a8433a;color:#fff}
.bdg.good{color:#9be08a;border-color:#4f8a45}.bdg.good i{background:#4f8a45;color:#fff}
.bdg.info{color:var(--frost)}.bdg.info i{background:#2a3a48;color:var(--frost)}
.bdg.pop{animation:bdgpop .6s cubic-bezier(.2,1.6,.4,1)}@keyframes bdgpop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:none}}
.chrono{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.chrono span{font-family:var(--f-disp);font-size:30px;color:var(--ember)}.chrono small{color:var(--dim);font-size:13px}.chrono b{color:var(--ok)}
.chip.clock{font-variant-numeric:tabular-nums;color:var(--bone)}
.chbar{position:absolute;left:0;bottom:0;height:4px;width:0;background:#d89b47;transition:width .05s}.chbar.t1{background:#ff9a4a}.chbar.t2{background:#ff6a2a}.chbar.t3{background:#fff1a8;box-shadow:0 0 8px #ffd27a}
.hurtv{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3;background:radial-gradient(ellipse at center,transparent 45%,rgba(200,20,10,.55) 80%,rgba(140,0,0,.85) 100%)}
.stage.lowhp::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 55%,rgba(160,0,0,.45) 100%);animation:lowpulse 1s ease-in-out infinite}
@keyframes lowpulse{50%{opacity:.35}}
.stage.hitflash{animation:hitshake .25s}@keyframes hitshake{20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,0)}}
.bar i.ghost{background:#fff1a8;opacity:.75;transition:none}.bar.big{position:relative}.bar.big i{position:absolute;left:0;top:0;bottom:0}
.challenger .nc{color:#ff6a2a;letter-spacing:.3em;font-size:14px;animation:ncblink 1s steps(2) infinite}@keyframes ncblink{50%{opacity:.3}}
.nch{font-family:var(--f-disp);font-weight:400;font-size:clamp(40px,8vw,92px);letter-spacing:.08em;color:#fff1a8;text-shadow:0 0 30px #e8a040,0 0 60px #ff6a2a;animation:nchin 1.2s cubic-bezier(.2,1.4,.4,1)}@keyframes nchin{from{transform:scale(2.4);opacity:0;filter:blur(8px)}}
.trainp{position:absolute;top:calc(96px + env(safe-area-inset-top,0px));right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;align-items:center;padding:10px 14px;background:rgba(10,12,16,.82);border:1px solid var(--line);border-radius:10px;z-index:1}
.tstats{display:flex;gap:16px;font-size:14px}.tstats b{color:var(--ember);font-size:20px;font-variant-numeric:tabular-nums;margin-left:4px}
.chip{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:20px;color:var(--frost);background:var(--well);white-space:nowrap}
.chip.warn{color:var(--blood);border-color:color-mix(in srgb,var(--blood) 50%,var(--line))}
.chip.good{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.pip{width:9px;height:9px;border-radius:50%;background:var(--c,var(--dim));display:inline-block;flex:none}
.toast{border:1px solid var(--ember);color:var(--ember);padding:10px 12px;border-radius:3px;background:color-mix(in srgb,var(--ember) 8%,var(--bg))}

/* Temple */
.title{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.title .kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ember)}
.title h1{font-size:46px;line-height:1}
.title p{color:var(--dim);max-width:46ch}
.wallet{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.wallet div{display:flex;flex-direction:column;gap:2px}
.wallet b{font-family:var(--f-disp);font-size:24px;font-weight:400}
.cprev{display:grid;place-items:center;background:#0e1114;border-radius:8px;overflow:hidden}.cprev img{width:100%;max-width:560px;display:block}
.pacts,.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.pact{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:9px 11px;border:1px solid var(--line);border-radius:8px}.pact:hover{border-color:var(--dim)}.pact.on{border-color:var(--blood);background:color-mix(in srgb,var(--blood) 10%,transparent)}.pact small,.ach small{font-size:12.5px;color:var(--dim)}.pact:focus-visible{outline:2px solid var(--ember)}
.rushp{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(8,10,14,.55);padding:16px}.rpin{text-align:center;max-width:820px;width:100%}.rpin h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(24px,4vw,38px);margin:4px 0 14px;color:var(--bone)}
.rpc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.rpcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(18,21,27,.92);transition:transform .12s,border-color .12s}.rpcard:hover:not([disabled]){transform:translateY(-3px);border-color:var(--ember)}.rpcard.on{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 14%,rgba(18,21,27,.95))}.rpcard.off{opacity:.35}.rpcard.duo{border-color:#7fd3ff88;position:relative}.rpcard.duo .rpi{color:#9fdcff}.rptag{position:absolute;top:8px;right:10px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9fdcff;border:1px solid #7fd3ff66;border-radius:999px;padding:1px 7px}.duoi{margin-top:4px;font-size:14px;color:#9fdcff;letter-spacing:2px}
.rpcard .rpi{font-size:28px;color:var(--ember)}.rpcard b{font-size:15px;color:var(--bone)}.rpcard small{font-size:12.5px;color:var(--dim)}.rpin .dim{margin-top:12px;font-size:13.5px}
@media (max-width:600px){.rpc{grid-template-columns:1fr}.rpcard{flex-direction:row;padding:10px 12px;text-align:left}.rpcard .rpi{font-size:22px}}
.rushres{text-align:center;padding:10px;margin-bottom:10px;border:1px solid var(--ember);border-radius:10px}.rushres h2{font-family:var(--f-disp);font-weight:400;margin:4px 0}
.amodes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.amode{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-align:center;transition:border-color .15s,transform .15s}.amode:hover{border-color:var(--dim);transform:translateY(-2px)}.amode.on{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 9%,var(--panel))}.amode:focus-visible{outline:2px solid var(--ember)}
.amart{display:flex;justify-content:center;width:100%}.amart svg{width:min(170px,100%);height:auto;display:block}.amode b{font-family:var(--f-disp);font-weight:400;font-size:22px;color:var(--bone)}.amode.on b{color:var(--ember)}.amode small{font-size:13px;color:var(--dim)}
@media (max-width:520px){.amart svg{width:110px}.amode b{font-size:18px}.amode{padding:10px 8px 12px}}
.prest{margin:8px 0;padding:9px 12px;border:1px solid var(--ember);border-radius:10px;background:color-mix(in srgb,var(--ember) 7%,transparent)}.prest p{margin:4px 0 6px;font-size:13px}
.satk{max-width:640px;margin:12px auto;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-align:left}.satkl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 12px;margin:8px 0}.satkl div{display:flex;flex-direction:column}.satkl b{font-size:14px;color:var(--bone)}.satkl small{font-size:12.5px;color:var(--dim)}
.parity{position:absolute;right:max(22px,env(safe-area-inset-right,0px));top:calc(108px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 16px;border-radius:12px;background:rgba(10,12,16,.82);border:2px solid #c58cff;pointer-events:none;text-align:center;max-width:min(300px,40vw)}.parity b{font-family:var(--f-disp);font-weight:400;font-size:24px;letter-spacing:.12em;color:#e2c8ff}.parity.pair{border-color:#7fd3ff}.parity.pair b{color:#bfe8ff}.parity span{font-size:13px;color:var(--bone)}.parity small{font-size:12px;color:var(--dim)}.touch .parity{top:calc(96px + env(safe-area-inset-top,0px));padding:4px 10px}.touch .parity b{font-size:18px}
.coban{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 12px;padding:9px 14px;border:1px solid #7fd3ff66;border-radius:10px;background:color-mix(in srgb,#7fd3ff 8%,transparent)}.coban b{color:#9fdcff}.coban span{font-size:13.5px;color:var(--dim)}.coban .cost{color:var(--bone);margin-left:auto}.coban.warn{border-color:var(--line)}
.coopb{position:absolute;left:max(22px,env(safe-area-inset-left,0px));top:calc(124px + env(safe-area-inset-top,0px));width:min(230px,30vw);background:rgba(10,12,16,.8);border:1px solid #7fd3ff55;border-radius:10px;padding:7px 10px;font-size:13px;pointer-events:none}.coopb b{color:#9fdcff;font-weight:600}.coopb .bar{margin-top:4px;height:6px}.coopb small{display:block;margin-top:3px;color:var(--ember);font-size:11.5px}.touch .coopb{top:calc(70px + env(safe-area-inset-top,0px));width:min(180px,28vw);padding:5px 8px;font-size:12px}
.lookrow{display:flex;gap:10px;align-items:flex-start;margin:6px 0}.lookrow .lk{min-width:46px;color:var(--dim);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;padding-top:7px}.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px}.chipb:hover{border-color:var(--dim)}.chipb.on{border-color:var(--ember);color:var(--ember);background:color-mix(in srgb,var(--ember) 10%,transparent)}.chipb:focus-visible{outline:2px solid var(--ember)}
.arw{display:flex;flex-wrap:wrap;gap:4px 8px}.ttlc{color:var(--bone)}.aurc{color:var(--c)}.ladrow .nm .ttl{display:block;font-size:11px;color:var(--dim);font-style:italic;overflow:hidden;text-overflow:ellipsis}
.ach{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;opacity:.7}.ach.done{opacity:1;border-color:var(--ok)}.ach.done b{color:var(--ok)}
.daily{border-color:var(--ember)}
.weekly{border-color:#b48cff}.wmods{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}.wmod{border:1px solid color-mix(in srgb,#b48cff 45%,var(--line));border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,#b48cff 7%,var(--panel))}.wmod b{color:#d6bcff;font-weight:600}.wmod small{font-size:12.5px;color:var(--bone);opacity:.85}.wmod.pact{border-color:color-mix(in srgb,var(--ember) 40%,var(--line));background:color-mix(in srgb,var(--ember) 6%,var(--panel))}.wmod.pact b{color:var(--ember)}
.wcls{display:flex;flex-wrap:wrap;gap:6px}.wcls button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:13px;color:var(--dim)}.wcls button.on{color:var(--bone);border-color:#b48cff;background:color-mix(in srgb,#b48cff 14%,var(--panel2))}

.tali{font-size:12.5px;margin:4px 0 10px}.tpl{color:var(--ember);font-weight:600}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tbr{display:flex;flex-direction:column;align-items:stretch}.tbh{display:flex;flex-direction:column;margin-bottom:6px;min-height:36px}.tbh b{font-family:var(--f-disp);font-size:17px;font-weight:400}.tbh small{font-size:11.5px}
.tnode{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 9px;min-height:96px}
.tnode b{font-size:14px;font-weight:600}.tnode small{font-size:12px;color:var(--dim);line-height:1.3}.tnode em{font-style:normal;font-size:11px;color:var(--dim);margin-top:auto;padding-top:3px;opacity:.85}
.trk{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tnode.can{border-color:color-mix(in srgb,var(--ember) 55%,var(--line))}.tnode.can:hover{background:color-mix(in srgb,var(--ember) 9%,var(--panel2))}
.tnode.on{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 16%,var(--panel2))}.tnode.on small{color:var(--bone)}.tnode.on .trk{color:var(--ember)}
.tnode.off{opacity:.5;cursor:not-allowed}
.tnode.ks{border-style:solid;border-width:1px 1px 1px 3px}.tnode.ks .trk{color:#c9a0ff}.tnode.ks.on{border-color:#c9a0ff;background:color-mix(in srgb,#b48cff 16%,var(--panel2))}.tnode.ks.on .trk{color:#c9a0ff}.tnode.ks.can{border-left-color:#b48cff}
.tlink{display:block;width:2px;height:10px;background:var(--line);margin:0 auto}.tlink.on{background:var(--ember)}
.talchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
@media (max-width:480px){.tnode{padding:7px}.tnode b{font-size:13px}.tnode small{font-size:11.5px}.tbh b{font-size:15px}}


#app.wide{max-width:1060px}#app.mid{max-width:760px}
.pgrid .cprev img{max-height:150px;object-fit:contain}
.mtitle{text-align:center;align-items:center;padding:18px 0 4px}.mtitle h1{font-size:52px}
.mgrid{display:grid;grid-template-columns:1fr;gap:14px}
.mhero{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--ember) 14%,var(--panel)),var(--well));min-height:180px;display:flex;flex-direction:column;justify-content:flex-end}
.mhero img{display:block;width:100%;max-height:260px;object-fit:contain}.mempty{padding:40px 20px;text-align:center;color:var(--dim);font-family:var(--f-disp);font-size:20px;line-height:1.4}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:color-mix(in srgb,var(--well) 70%,transparent)}.mstats span{display:flex;flex-direction:column;align-items:center;padding:8px 4px}.mstats small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}.mstats b{font-size:18px;font-weight:500}
.mnav{display:flex;flex-direction:column;gap:8px}
.mbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 16px;transition:border-color .15s,transform .15s,background .15s}
.mbtn span{display:flex;flex-direction:column;gap:2px;min-width:0}.mbtn b{font-family:var(--f-disp);font-weight:400;font-size:21px;letter-spacing:.02em}.mbtn small{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtn:hover{border-color:var(--dim);transform:translateX(3px)}.mbtn.prim{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 14%,var(--panel))}.mbtn.prim b{color:var(--ember)}
.marr{font-style:normal;color:var(--dim);font-size:24px}.mdot{font-style:normal;background:var(--ember);color:#1a1208;border-radius:12px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px}
.mnote{text-align:center;font-size:13.5px}.mfoot2{justify-content:center}

.hback{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;gap:6px;align-items:center;font-size:15px}.hback:hover{border-color:var(--dim)}
.hwal{color:var(--ember);font-size:15px;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.steps button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 4px;font-size:13px;color:var(--dim);display:flex;gap:6px;align-items:center;justify-content:center}.steps i{font-style:normal;width:18px;height:18px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:11px}

/* aperçu d'un objet avant de l'équiper (pour la fenêtre « objet obtenu ») */
function gotItem(it,force){const k=force||slotKey(it),old=run.items[k];const im=withSlot(it,k);let img='';try{img=renderPortrait(Object.assign({},run,{items:Object.assign({},run.items,{[k]:it})}),280,340)}catch(_){}return {kind:'item',it,rows:im.rows,sets:im.sets,img,old:old&&old.name}}
function withSlot(it,k){const a=heroSnap(),c0=setCounts(),old=run.items[k];run.items[k]=it;let b,c1;try{b=heroSnap();c1=setCounts()}finally{if(old)run.items[k]=old;else delete run.items[k]}
  const rows=Object.keys(SNAPN).filter(x=>a[x]!==b[x]).map(x=>({k:x,a:a[x],b:b[x],d:b[x]-a[x],pc:a[x]?Math.round((b[x]-a[x])/a[x]*100):0}));const sets=[];
  new Set([...Object.keys(c0),...Object.keys(c1)]).forEach(id=>{const S=SETS[id];if(!S)return;[2,3,4].forEach(t=>{const x=c0[id]||0,y=c1[id]||0;if(x<t&&y>=t)sets.push({ok:1,txt:`${S.n} ${t}/4 : `+Object.entries(setB(S,t)).map(([q,v])=>`+${v} ${STATN[q]}`).join(', ')});if(x>=t&&y<t)sets.push({ok:0,txt:`Perdu : ${S.n} ${t}/4`})})});return {rows,sets}}

function smpLoad(){const C=AU.ctx;if(!C||AU.buf)return;AU.buf={};for(const k in SMP){try{const bin=atob(SMP[k]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const pr=C.decodeAudioData(u.buffer,b=>{AU.buf[k]=b},()=>{});if(pr&&pr.catch)pr.catch(()=>{})}catch(_){}}}
function smp(k,o){const C=AU.ctx,b=AU.buf&&AU.buf[k];if(!C||!b||VOL().rec===false||(AU.v||0)>28)return false;o=o||{};AU.v=(AU.v||0)+1;
  const s=C.createBufferSource(),g=C.createGain();s.buffer=b;s.playbackRate.value=(o.rate||1)*(.94+Math.random()*.12);g.gain.value=o.vol??.5;
  let nd=s;if(o.lp||o.hp){const fl=C.createBiquadFilter();fl.type=o.lp?'lowpass':'highpass';fl.frequency.value=o.lp||o.hp;nd.connect(fl);nd=fl}nd.connect(g);g.connect(AU.sfx);s.onended=()=>{AU.v--;try{g.disconnect()}catch(_){}};s.start(C.currentTime+(o.delay||0));return true}
/* bruit d'impact selon ce qu'on frappe : chair, os, pierre, chitine, armure, écailles, bois, vase, glace */
const MATB={bouftou:'flesh',tofu:'flesh',scara:'chitin',wa:'flesh',craq:'stone',krala:'slime',kimbo:'armor',obsi:'scale',hare:'flesh',secret:'bone',dummy:'wood'},
  MATA={bouftou:'flesh',tofu:'flesh',scaraf:'chitin',wabbit:'wood',roc:'stone',tentacule:'slime',glyphe:'armor',givre:'ice',rouage:'bone'};
const smv=(k,o)=>smp(k+Math.floor(Math.random()*3),o);
function impactMat(m,v,hv){const H=hv?1.2:1,V=x=>x*v*H;
  switch(m){
  case 'bone':smv('wL',{vol:V(.7),rate:hv?1.15:1.35});smv('pl',{vol:V(.25),rate:1.5,delay:.015});tone(140,.06,{to:80,vol:V(.1)});break;
  case 'stone':smv('mi',{vol:V(.75),rate:hv?.8:.95});tone(62,.16,{to:36,vol:V(.22)});break;
  case 'chitin':smv('wL',{vol:V(.55),rate:1.6});smv('pM',{vol:V(.35),rate:1.25,hp:700});break;
  case 'armor':smv(hv?'mH':'mM',{vol:V(.6),rate:hv?.95:1.05});smv('pM',{vol:V(.3),rate:.9,lp:1500});break;
  case 'scale':smv(hv?'pH':'pM',{vol:V(.6),rate:.9});smv('pl',{vol:V(.18),rate:.8});break;
  case 'wood':smv(hv?'wH':'wM',{vol:V(.7),rate:1});break;
  case 'slime':smv(hv?'sH':'sM',{vol:V(.75),rate:.72,lp:1400});noise(.18,{ft:'lowpass',f:900,to:180,vol:V(.18)});tone(300,.14,{to:90,vol:V(.1)});break;
  case 'ice':smv('gl',{vol:V(.55),rate:hv?1:1.15});smv('mi',{vol:V(.2),rate:1.4});break;
  default:smv(hv?'pH':'pM',{vol:V(.75),rate:hv?.92:1});smv('sM',{vol:V(.3),rate:.85,lp:900});tone(85,.1,{to:45,vol:V(.16)})}}

function LPchain(par,mat,n,L,r0,r1,rad){const T=THREE,segs=[];let parent=par;
  for(let i=0;i<n;i++){const g=new T.Group();if(i>0)g.position.y=L/n;parent.add(g);
    const ra=r0+(r1-r0)*i/n,rb=r0+(r1-r0)*(i+1)/n,geo=new T.CylinderGeometry(rb,ra,L/n*1.06,rad||6);geo.translate(0,L/n/2,0);
    const m=new T.Mesh(geo,mat);m.castShadow=true;m.receiveShadow=true;g.add(m);segs.push(g);parent=g}
  return segs}

/* La Mandragore Mère (étage IV) */
function creatureMandragore(R){
  const T=THREE,g=new T.Group(),wrap=new T.Group(),body=new T.Group();g.add(wrap);wrap.add(body);wrap.scale.setScalar(R/3.6*1.1);
  const bark=LPM('#7a5a3c'),barkD=LPM('#4e3a28'),leaf=LPM('#4f7a32'),leafL=LPM('#76a845'),sh=LPshard();
  const eye=new T.MeshBasicMaterial({color:new T.Color('#b6e07a')});
  const trunk=new T.Group();trunk.position.y=1.3;body.add(trunk);
  const prof=[[0,0],[.55,.25],[1.15,1.0],[1.35,2.0],[1.15,3.0],[.75,3.75],[.35,4.25],[0,4.4]].map(([r,y])=>new T.Vector2(r,y));
  LPadd(trunk,new T.LatheGeometry(prof,7),bark,0,0,0,1,1,.85);
  [[.6,1.6,.7,.5],[-.5,2.4,-.6,.4],[.2,3.2,.65,.35]].forEach(([x,y,z,s])=>LPadd(trunk,new T.IcosahedronGeometry(s,0),barkD,x,y,z));
  const heart=LPadd(trunk,new T.OctahedronGeometry(.3,0),sh,1.2,1.9,0,1,1.9,.9);
  [-1,1].forEach(sd=>{LPadd(trunk,new T.BoxGeometry(.12,.1,.38),eye,1.05,3.05,.38*sd).castShadow=false});
  // couronne de feuilles
  const crown=new T.Group();crown.position.y=4.3;trunk.add(crown);
  const leaves=[];for(let i=0;i<8;i++){const a=i/8*Math.PI*2,pv=new T.Group();pv.rotation.y=a;crown.add(pv);
    const lf=LPadd(pv,new T.ConeGeometry(.35,2.2-(i%2)*.5,4),i%2?leaf:leafL,.35,1.0,0,1,1,.3);lf.rotation.z=-.45-(i%2)*.15;leaves.push(pv)}
  // bras-branches articulés
  const arms=[-1,1].map(sd=>{const pv=new T.Group();pv.position.set(.2,3.2,1.0*sd);trunk.add(pv);pv.rotation.set(sd*1.1,0,0);
    const segs=LPchain(pv,bark,4,3.2,.32,.1,5);
    const tw=LPadd(segs[2],new T.CylinderGeometry(.04,.08,.9,4),barkD,0,.4,.2*sd);tw.rotation.x=sd*-.9;
    LPadd(segs[3],new T.ConeGeometry(.18,.6,4),leaf,0,.9,0,1,1,.4);
    return {pv,segs,sd}});
  // racines-jambes
  const roots=[0,1,2,3].map(i=>{const a=i/4*Math.PI*2+.4,pv=new T.Group();pv.position.set(Math.cos(a)*.45,1.45,Math.sin(a)*.45);body.add(pv);
    pv.rotation.set(-Math.sin(a)*.9,0,Math.cos(a)*.9);const segs=LPchain(pv,barkD,3,1.9,.32,.06,5);segs.forEach((s,j)=>{s.rotation.z=0;s.rotation.x=0});
    segs[0].rotation.x=Math.PI;return {pv,segs,a,ph:i*1.6}});
  return {g,body,trunk,crown,leaves,arms,roots,heart,rocks:[bark,barkD],mat:sh,ground:true,walk:0,
    anim(c,dt,st){const t=st.t;c.walk+=dt*st.spd*.08;const a=Math.min(1,st.spd/40);
      c.roots.forEach(r=>{r.segs[1].rotation.x=Math.sin(c.walk+r.ph)*.4*a;r.segs[2].rotation.x=Math.sin(c.walk+r.ph+1)*.3*a});
      let sway=Math.sin(t*1.3)*.05+Math.sin(c.walk)*.08*a,lean=0,armUp=[0,0],armFwd=[0,0],crownS=1;
      if(st.wind){if(st.kind==='line'){armUp=[.9*st.pr,.9*st.pr];armFwd=[-.6*st.pr,-.6*st.pr];lean=-.12*st.pr}else if(st.kind==='leap'){lean=.15*st.pr;c.trunk.position.y=1.3-.4*st.pr}else lean=.2*st.pr}
      else c.trunk.position.y+=(1.3-c.trunk.position.y)*Math.min(1,dt*8);
      if(st.lunge){armFwd=[1.1,1.1];armUp=[.2,.2];lean=.25}
      if(st.planting){lean=.35}
      if(st.roar){armUp=[1.3,1.3];crownS=1.25;lean=-.2}
      if(st.stagger)sway=Math.sin(t*22)*.25;
      if(st.dead){lean=.6;armUp=[-.4,-.4];crownS=.7}
      LPease(c.trunk.rotation,'x',sway,dt,10);LPease(c.trunk.rotation,'z',-lean,dt,10);
      c.arms.forEach((A,i)=>{LPease(A.pv.rotation,'x',A.sd*(1.1-armUp[i]),dt,14);LPease(A.pv.rotation,'z',-armFwd[i],dt,14);
        A.segs.forEach((s,j)=>{if(j)LPease(s.rotation,'z',-.18-Math.sin(t*2+j)*.06-(st.lunge?.05:0),dt,10)})});
      c.leaves.forEach((l,i)=>{l.children[0].rotation.x=Math.sin(t*2+i)*.08});c.crown.scale.setScalar(crownS);
      const p=1+(st.wind?.3*st.pr:0)+Math.sin(t*3)*.05;c.heart.scale.set(p,1.9*p,.9*p)}};
}

/* Basalte, le colosse fendu (étage V) */
function creatureBasalte(R){
  const T=THREE,g=new T.Group(),wrap=new T.Group(),body=new T.Group();g.add(wrap);wrap.add(body);wrap.scale.setScalar(R/5*1.1);
  const rock=LPM('#3b3a3d',{roughness:.95}),rockL=LPM('#56545b',{roughness:.95});
  const lava=new T.MeshStandardMaterial({color:new T.Color('#3a1a0c'),emissive:new T.Color(COL.ember),emissiveIntensity:.8,roughness:.6,flatShading:true});
  const dod=s=>new T.DodecahedronGeometry(s,0);
  const torso=new T.Group();torso.position.y=3.6;body.add(torso);
  LPadd(torso,dod(1),rock,0,0,0,1.9,1.75,1.75);
  LPadd(torso,dod(1),rockL,.3,1.25,0,1.4,.9,2.0);
  LPadd(torso,dod(.8),rock,-.2,-1.2,0,1.2,.8,1.3);
  [[.55,1.9,1.2],[.4,2.0,-1.25],[-.6,1.6,.2]].forEach(([x,y,z])=>LPadd(torso,new T.ConeGeometry(.45,1.2,5),rockL,x,y,z).rotation.set(z*.3,0,-x*.3));
  // faille de lave
  [[1.62,.5,0,.9,.18,-.35],[1.7,-.15,.15,.7,.16,.3],[1.55,-.75,-.05,.8,.15,-.2]].forEach(([x,y,z,l,w,r])=>{const c=LPadd(torso,new T.BoxGeometry(.12,l,w),lava,x,y,z);c.rotation.x=r;c.castShadow=false});
  const head=new T.Group();head.position.set(.5,2.05,0);torso.add(head);
  LPadd(head,dod(.5),rock,0,.15,0,1,.9,1);
  const eyeS=LPadd(head,new T.BoxGeometry(.1,.12,.55),LPshard(),.45,.15,0);
  // bras colossaux : épaule, avant-bras, poing
  const arms=[-1,1].map(sd=>{const pv=new T.Group();pv.position.set(.2,.9,2.05*sd);torso.add(pv);
    LPadd(pv,dod(.75),rockL,0,0,.15*sd,1,1,1);
    LPadd(pv,new T.BoxGeometry(.9,1.8,.95),rock,0,-1.2,.2*sd).rotation.x=sd*.08;
    const fa=new T.Group();fa.position.set(0,-2.1,.25*sd);pv.add(fa);
    LPadd(fa,new T.BoxGeometry(1.0,1.7,1.0),rock,0,-.8,0);LPadd(fa,dod(.85),rockL,.1,-1.9,0,1.1,1,1.1);
    return {pv,fa,sd}});
  const legs=[-1,1].map((sd,i)=>{const pv=new T.Group();pv.position.set(-.1,2.2,.85*sd);body.add(pv);
    LPadd(pv,new T.BoxGeometry(1.15,2.2,1.1),rock,0,-1.05,0);LPadd(pv,new T.BoxGeometry(1.4,.4,1.3),rockL,.15,-2.05,0);return {pv,ph:i*Math.PI}});
  return {g,body,torso,head,arms,legs,rocks:[rock,rockL],mat:lava,ground:true,walk:0,
    anim(c,dt,st){const t=st.t;c.walk+=dt*st.spd*.06;const a=Math.min(1,st.spd/30);
      c.legs.forEach(L=>LPease(L.pv.rotation,'z',Math.sin(c.walk+L.ph)*.3*a,dt,12));
      let rx=Math.sin(c.walk)*.06*a,rz=0,up=[0,0],fwd=[0,0],elb=[.15,.15],ty=3.6;
      if(st.wind){if(st.kind==='cone'){up[1]=1.4*st.pr;fwd[1]=-.6*st.pr;rz=-.12*st.pr;elb[1]=.8*st.pr}
        else if(st.kind==='drops'||st.kind==='ring'){up=[2.4*st.pr,2.4*st.pr];rz=-.18*st.pr;ty=3.6+.3*st.pr;elb=[.5,.5]}else rz=-.1*st.pr}
      if(st.lunge){if(st.kind==='cone'){fwd[1]=1.5;up[1]=.3;rz=.2}else{fwd=[1.2,1.2];up=[.4,.4];rz=.3;ty=3.3}}
      if(st.roar){up=[2.6,2.6];rz=-.25}
      if(st.stagger)rx=Math.sin(t*20)*.12;
      if(st.dead){rz=.5;up=[-.2,-.2]}
      LPease(c.torso.rotation,'x',rx,dt,10);LPease(c.torso.rotation,'z',rz,dt,10);LPease(c.torso.position,'y',ty,dt,10);
      c.arms.forEach((A,i)=>{LPease(A.pv.rotation,'z',fwd[i]+up[i]*.55,dt,13);LPease(A.pv.rotation,'x',A.sd*(-up[i]*.35),dt,13);LPease(A.fa.rotation,'z',elb[i],dt,13)})}};
}

/* Mâchevase, la pieuvre des vases (étage VI) */
function creatureMachevase(R){
  const T=THREE,g=new T.Group(),wrap=new T.Group(),body=new T.Group();g.add(wrap);wrap.add(body);wrap.scale.setScalar(R/4.6*1.1);
  const skin=LPM('#3d4f57'),skinD=LPM('#26343a'),under=LPM('#6f8a86'),sh=LPshard();
  const eye=new T.MeshBasicMaterial({color:new T.Color('#9fe0cf')});
  const mantle=new T.Group();mantle.position.y=1.4;body.add(mantle);
  LPadd(mantle,new T.IcosahedronGeometry(1,1),skin,-.3,2.2,0,2.0,2.4,1.9).rotation.z=.35;
  LPadd(mantle,new T.IcosahedronGeometry(1,1),skinD,.5,1.0,0,1.9,1.15,1.95);
  [-1,1].forEach(sd=>{LPadd(mantle,new T.IcosahedronGeometry(1,0),under,1.75,1.25,.8*sd,.32,.42,.5);LPadd(mantle,new T.IcosahedronGeometry(1,0),eye,1.98,1.3,.82*sd,.1,.26,.32).castShadow=false});
  LPadd(mantle,new T.ConeGeometry(.25,.9,5),skinD,-.8,1.4,1.85).rotation.x=1.2;
  const heart=LPadd(mantle,new T.OctahedronGeometry(.32,0),sh,-.6,4.5,0,1,2.2,1);heart.rotation.z=.35;
  const tents=[];for(let i=0;i<8;i++){const a=i/8*Math.PI*2+.2,root=new T.Group();root.position.set(Math.cos(a)*1.6,1.25,Math.sin(a)*1.6);root.rotation.y=-a;body.add(root);
    const base=new T.Group();base.rotation.z=-1.8;root.add(base);const segs=LPchain(base,i%2?skin:skinD,6,4.2,.5,.08,6);tents.push({base,segs,a,ph:i*.8,front:Math.cos(a)>.3})}
  return {g,body,mantle,tents,heart,rocks:[skin,skinD],mat:sh,ground:true,walk:0,
    anim(c,dt,st){const t=st.t;c.walk+=dt*st.spd*.05;const a=Math.min(1,st.spd/30);
      let lift=0,curl=.22,wave=.18,mz=Math.sin(t*1.1)*.04,my=1.4+Math.sin(t*1.6)*.08,spread=0,pulse=1;
      if(st.wind){if(st.kind==='drops'){lift=.9*st.pr}else if(st.kind==='circle'){spread=1.1*st.pr;curl=.05;my=1.4+.5*st.pr}else if(st.kind==='proj'){pulse=1-.12*st.pr;mz=-.15*st.pr}}
      if(st.lunge){if(st.kind==='circle'){spread=-.4;curl=.45}else{lift=-.3;mz=.15}}
      if(st.roar){spread=1.2;my=2.1}
      if(st.stagger)mz=Math.sin(t*20)*.15;
      if(st.dead){curl=.05;wave=.02;my=.6}
      LPease(c.mantle.rotation,'z',mz,dt,10);LPease(c.mantle.position,'y',my,dt,8);c.mantle.scale.set(pulse,1/pulse,pulse);
      c.tents.forEach((T2,i)=>{LPease(T2.base.rotation,'z',-1.8+(T2.front?lift:lift*.3)+spread,dt,12);
        T2.segs.forEach((s,j)=>{if(j)s.rotation.z=curl+Math.sin(t*2.2+T2.ph+j*.7+c.walk)*(wave+.1*a)})});
      const p=1+(st.wind?.3*st.pr:0)+Math.sin(t*3)*.05;c.heart.scale.set(p,2.2*p,p)}};
}

 wabbit(Rr){const T=THREE,g=new T.Group(),b=new T.Group();g.add(b);b.scale.setScalar(Rr/1.4*.6);

 scaraf(Rr){if(MON.spiderling&&window.THREE&&THREE.SkeletonUtils)return monsterMini('spiderling',Rr,.75,['attack1','attack2'],1,0);return ADDMODELS._scaraf?ADDMODELS._scaraf(Rr):null},

 roc(Rr){if(MON.golem&&window.THREE&&THREE.SkeletonUtils)return monsterMini('golem',Rr,2.4,['attack1','attack2','attack3']);const T=THREE,g=new T.Group(),b=new T.Group();g.add(b);b.scale.setScalar(Rr/2.4*.62);

 // Bras d'encre : un tentacule qui sort d'une flaque d'encre
 tentacule(Rr){const T=THREE,g=new T.Group(),b=new T.Group();g.add(b);b.scale.setScalar(Rr/1.8*.75);

/* L'Arbitre aux deux visages (étage VII) */
function creatureArbitre(R){
  const T=THREE,g=new T.Group(),wrap=new T.Group(),body=new T.Group();g.add(wrap);wrap.add(body);wrap.scale.setScalar(R/3.8*1.1);
  const robe=LPM('#2c2236'),robeL=LPM('#47385a'),trim=LPM('#c9a24e',{metalness:.6,roughness:.35}),skin=LPM('#3a2f2a'),sh=LPshard();
  const light=LPM('#e6dccb',{roughness:.5}),dark=LPM('#16141a',{roughness:.4});
  const prof=[[1.9,0],[1.7,.6],[1.25,2.4],[.95,3.8],[.75,4.6],[.4,4.95],[0,5.0]].map(([r,y])=>new T.Vector2(r,y));
  const tor=new T.Group();body.add(tor);
  LPadd(tor,new T.LatheGeometry(prof,7),robe);
  LPadd(tor,new T.CylinderGeometry(1.92,1.95,.18,7),trim,0,.12,0);
  LPadd(tor,new T.CylinderGeometry(.85,.9,.16,7),trim,0,3.9,0);
  const heart=LPadd(tor,new T.OctahedronGeometry(.3,0),sh,1.05,3.2,0,1,1.9,.8);
  // tête : masque coupé en deux, tourne pour montrer la parité
  const head=new T.Group();head.position.y=5.6;tor.add(head);
  const half=(a)=>new T.SphereGeometry(.7,10,8,a,Math.PI);
  LPadd(head,half(0),light);LPadd(head,half(Math.PI),dark);
  [-1,1].forEach(sd=>{LPadd(head,new T.ConeGeometry(.16,1.3,5),robeL,0,.85,.38*sd).rotation.x=sd*-.35});
  const eyeL=LPadd(head,new T.BoxGeometry(.06,.1,.28),dark,.04,.12,.69);eyeL.rotation.y=Math.PI/2;
  const eyeD=LPadd(head,new T.BoxGeometry(.06,.1,.28),light,.04,.12,-.69);eyeD.rotation.y=Math.PI/2;
  // quatre bras et leurs anneaux de glyphes
  const rings=[],arms=[[1,.55,4.2,'frost'],[1,.3,3.5,'ember'],[-1,.55,4.2,'ember'],[-1,.3,3.5,'frost']].map(([sd,up,y,col],i)=>{
    const pv=new T.Group();pv.position.set(.1,y,.8*sd);tor.add(pv);pv.rotation.x=sd*(1.15-up);
    const segs=LPchain(pv,robeL,2,1.9,.2,.13,5);
    const m=new T.MeshStandardMaterial({color:new T.Color(COL[col]),emissive:new T.Color(COL[col]),emissiveIntensity:.4,roughness:.3,flatShading:true});
    const rg=new T.Mesh(new T.TorusGeometry(.85,.14,6,18),m);rg.position.y=1.2;rg.castShadow=true;segs[1].add(rg);rings.push({rg,m,col});
    return {pv,segs,sd,base:sd*(1.15-up)}});
  return {g,body,tor,head,arms,rings,heart,rocks:[robe,robeL],mat:sh,ground:true,
    anim(c,dt,st){const t=st.t,pair=st.par==='pair';
      // face claire (pair) ou sombre (impair) tournée vers l'avant
      LPease(c.head.rotation,'y',pair?Math.PI/2:-Math.PI/2,dt,6);
      let lift=0,spin=1,hov=Math.sin(t*1.5)*.08,lean=0;
      if(st.wind){if(st.kind==='drops'){lift=1.0*st.pr}else if(st.kind==='proj'){spin=1+6*st.pr;lift=.4}else if(st.kind==='safe'){lift=1.5*st.pr;spin=1+10*st.pr;hov+=.6*st.pr}}
      if(st.lunge){lift=-.3;lean=.15}
      if(st.roar){lift=1.6;spin=8}
      if(st.stagger)lean=Math.sin(t*20)*.12;
      if(st.dead){lift=-.6;lean=.4}
      c.body.position.y=hov;LPease(c.tor.rotation,'z',-lean,dt,10);
      c.arms.forEach((A,i)=>{LPease(A.pv.rotation,'x',A.base-A.sd*lift,dt,12);A.segs[1].rotation.z=-.4+Math.sin(t*1.7+i)*.15});
      c.rings.forEach((r,i)=>{r.rg.rotation.y+=dt*spin*(1+i*.2);const on=(r.col==='frost')===pair;LPease(r.m,'emissiveIntensity',on?1.4:.15,dt,8)});
      const p=1+(st.wind?.3*st.pr:0)+Math.sin(t*3)*.05;c.heart.scale.set(p,1.9*p,.8*p)}};
}

/* Hiverne, la wyverne de verre noir (étage VIII) */
function creatureHiverne(R){
  const T=THREE,g=new T.Group(),wrap=new T.Group(),body=new T.Group();g.add(wrap);wrap.add(body);wrap.scale.setScalar(R/4.8*1.1);

  const sh=LPshard(),eye=new T.MeshBasicMaterial({color:new T.Color('#bfe3f5')});

  LPadd(tor,new T.IcosahedronGeometry(1,0),glass,0,0,0,2.1,1.3,1.25).rotation.z=.15;

  for(let i=0;i<5;i++)LPadd(tor,new T.OctahedronGeometry(.32,0),ice,1.0-i*.55,1.15-i*.08,0,1,2.2,.6).rotation.z=.5;
  const heart=LPadd(tor,new T.OctahedronGeometry(.3,0),sh,1.75,-.35,0,1,1.8,.8);
  // cou et tête
  const neck=new T.Group();neck.position.set(1.6,.6,0);tor.add(neck);
  const nsegs=LPchain(neck,glass,4,2.6,.5,.32,6);neck.rotation.z=-1.0;
  const head=new T.Group();head.position.y=.75;nsegs[3].add(head);
  LPadd(head,new T.ConeGeometry(.42,1.6,5),glass,0,.6,0,1,1,.9);
  [-1,1].forEach(sd=>{LPadd(head,new T.ConeGeometry(.12,1.1,4),ice,-.25,.0,.32*sd).rotation.set(sd*.5,0,2.4);LPadd(head,new T.OctahedronGeometry(.09,0),eye,.18,.3,.27*sd).castShadow=false});
  const maw=LPadd(head,new T.OctahedronGeometry(.18,0),new T.MeshBasicMaterial({color:new T.Color('#bfe3f5'),transparent:true,opacity:0}),0,1.45,0);maw.castShadow=false;
  // ailes de verre (lames triangulaires)
  const wingGeo=(()=>{const gg=new T.BufferGeometry();const v=new Float32Array([0,0,0, -3.6,.6,4.6, -1.0,0,5.6, 0,0,0, -1.0,0,5.6, 1.2,-.1,3.4, 0,0,0, -3.6,.6,4.6, -4.4,-.2,2.0]);gg.setAttribute('position',new T.BufferAttribute(v,3));gg.computeVertexNormals();return gg})();
  const wingM=new T.MeshStandardMaterial({color:new T.Color('#1d212b'),roughness:.15,metalness:.4,side:T.DoubleSide,flatShading:true});
  const wings=[-1,1].map(sd=>{const pv=new T.Group();pv.position.set(.6,.7,.7*sd);tor.add(pv);const w=new T.Mesh(wingGeo,wingM);w.castShadow=true;w.scale.z=sd;pv.add(w);
    const rib=LPadd(pv,new T.CylinderGeometry(.06,.12,5.6,4),ice,-1.8,.3,2.3*sd);rib.rotation.set(sd*1.0,0,.6);return {pv,sd}});
  // pattes et queue
  const legs=[-1,1].map((sd,i)=>{const pv=new T.Group();pv.position.set(-.3,-.6,.75*sd);tor.add(pv);
    LPadd(pv,new T.CylinderGeometry(.42,.3,1.6,5),glass,0,-.75,0);LPadd(pv,new T.CylinderGeometry(.26,.2,1.2,5),glassL,.3,-1.9,0).rotation.z=.3;
    for(let q=0;q<3;q++)LPadd(pv,new T.ConeGeometry(.1,.6,4),ice,.6,-2.6,(q-1)*.18).rotation.z=-1.4;return {pv,ph:i*Math.PI}});
  const tail=new T.Group();tail.position.set(-1.8,0,0);tor.add(tail);tail.rotation.z=1.9;
  const tsegs=LPchain(tail,glass,6,5.0,.5,.06,5);LPadd(tsegs[5],new T.OctahedronGeometry(.35,0),ice,0,.8,0,1,2,.4);
  return {g,body,tor,neck,nsegs,head,maw,wings,legs,tsegs,heart,rocks:[glass,glassL],mat:sh,ground:true,walk:0,
    anim(c,dt,st){const t=st.t;c.walk+=dt*st.spd*.06;const a=Math.min(1,st.spd/30);
      c.legs.forEach(L=>LPease(L.pv.rotation,'z',Math.sin(c.walk+L.ph)*.5*a,dt,14));
      let nz=-1.0+Math.sin(t*1.2)*.05,curl=.16,wo=.15,flap=0,ty=3.3+Math.abs(Math.sin(c.walk))*.1*a,glow=0;
      if(st.wind){if(st.kind==='cone'){nz=-.25*st.pr-.5;curl=.25*st.pr;glow=st.pr}else if(st.kind==='line'){nz=-.4;curl=-.1}else if(st.kind==='drops'){wo=1.2*st.pr;flap=1;ty+=.5*st.pr}}
      if(st.lunge){if(st.kind==='cone'){nz=-1.2;curl=-.05;glow=1}else{nz=-1.25;curl=0}}
      if(st.roar){wo=1.3;flap=1;nz=-.3;curl=.3}
      if(st.stagger)curl=Math.sin(t*20)*.2;
      if(st.dead){nz=-1.6;wo=.05;ty=2.4}
      LPease(c.neck.rotation,'z',nz,dt,12);c.nsegs.forEach((s,j)=>{if(j)LPease(s.rotation,'z',curl,dt,12)});LPease(c.tor.position,'y',ty,dt,10);
      c.wings.forEach(W=>LPease(W.pv.rotation,'x',W.sd*-(wo+(flap?Math.sin(t*16)*.4:0)),dt,flap?26:10));
      c.tsegs.forEach((s,j)=>{if(j)s.rotation.z=.12+Math.sin(t*1.8+j*.6)*.1});
      c.maw.material.opacity=glow*.9;c.maw.scale.setScalar(1+glow*2);
      const p=1+(st.wind?.3*st.pr:0)+Math.sin(t*3)*.05;c.heart.scale.set(p,1.8*p,.8*p)}};
}

function creatureRegent(R){
  const T=THREE,g=new T.Group(),wrap=new T.Group(),body=new T.Group();g.add(wrap);wrap.add(body);wrap.scale.setScalar(R/4*1.15);
  const robe=LPM('#1b1824',{roughness:.9}),robeL=LPM('#2f2a3d'),brass=LPM('#b08a4a',{metalness:.85,roughness:.3}),face=LPM('#e6dccb',{roughness:.6});
  const glassM=new T.MeshStandardMaterial({color:new T.Color('#c9a24e'),emissive:new T.Color(COL.ember),emissiveIntensity:.5,roughness:.15,transparent:true,opacity:.85,flatShading:true});
  const crackM=new T.MeshBasicMaterial({color:new T.Color('#b48cff')});
  // robe déchirée qui flotte
  const rg=new T.ConeGeometry(1.9,4.6,9,3,true),rp=rg.attributes.position;
  for(let i=0;i<rp.count;i++){const y=rp.getY(i);if(y<-2.2){const ang=Math.atan2(rp.getZ(i),rp.getX(i));rp.setY(i,y-(Math.sin(ang*9)>0?.7:0)-Math.random()*.2)}}
  rg.computeVertexNormals();const rm=LPM('#1b1824',{roughness:.9,side:T.DoubleSide});
  const tor=new T.Group();tor.position.y=4.1;body.add(tor);
  LPadd(tor,rg,rm,0,-1.2,0);
  LPadd(tor,new T.IcosahedronGeometry(1,0),robeL,0,1.2,0,1.05,.8,1.05);
  [-1,1].forEach(sd=>LPadd(tor,new T.ConeGeometry(.45,.9,5),robeL,0,1.5,1.0*sd).rotation.x=sd*1.1);
  // sablier brisé dans la poitrine
  const hg=new T.Group();hg.position.set(.95,.55,0);tor.add(hg);
  LPadd(hg,new T.ConeGeometry(.32,.5,6),glassM,0,.25,0).rotation.x=Math.PI;LPadd(hg,new T.ConeGeometry(.32,.5,6),glassM,0,-.25,0);
  const crack=LPadd(hg,new T.BoxGeometry(.03,.55,.03),crackM,.2,.2,0);crack.rotation.z=.5;crack.castShadow=false;
  // tête-cadran
  const head=new T.Group();head.position.y=2.25;tor.add(head);
  LPadd(head,new T.CylinderGeometry(.95,.95,.18,24),face,0,0,0).rotation.z=Math.PI/2;
  LPadd(head,new T.TorusGeometry(.98,.09,6,24),brass,0,0,0).rotation.y=Math.PI/2;
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;LPadd(head,new T.BoxGeometry(.05,i%3?.08:.18,.05),robe,.11,Math.cos(a)*.78,Math.sin(a)*.78).rotation.x=-a}
  const hh=new T.Group();hh.position.x=.13;head.add(hh);const hm=new T.Group();hm.position.x=.14;head.add(hm);
  LPadd(hh,new T.BoxGeometry(.04,.5,.08),robe,0,.25,0);LPadd(hm,new T.BoxGeometry(.04,.75,.05),robe,0,.37,0);
  // bras-aiguilles
  const arms=[-1,1].map(sd=>{const pv=new T.Group();pv.position.set(0,1.5,1.05*sd);tor.add(pv);
    LPadd(pv,new T.CylinderGeometry(.14,.1,1.0,5),robeL,0,-.45,0);
    const nd=LPadd(pv,new T.ConeGeometry(.13,3.6,4),brass,0,-2.6,0);nd.rotation.x=Math.PI;return {pv,sd}});
  // engrenages flottants dans le dos
  const gears=[[-.9,2.1,.8,.9,1],[-1.0,1.3,-1.0,.6,-1.6],[-1.2,3.0,-.2,.5,2.2]].map(([x,y,z,s,sp])=>{const G=new T.Group();G.position.set(x,y,z);G.rotation.y=Math.PI/2;tor.add(G);
    LPadd(G,new T.TorusGeometry(s,s*.22,5,14),brass);for(let k=0;k<8;k++){const a=k/8*Math.PI*2;LPadd(G,new T.BoxGeometry(s*.3,s*.35,s*.25),brass,Math.cos(a)*s*1.15,Math.sin(a)*s*1.15,0).rotation.z=a}return {G,sp}});
  return {g,body,tor,head,hh,hm,arms,gears,hg,crack,heart:hg,rocks:[robeL,face],mat:glassM,ground:false,
    anim(c,dt,st){const t=st.t,p2=!!st.p2;
      let hov=Math.sin(t*1.3)*.25,up=[.75,.75],fwd=[.25,.25],tick=1,lean=0;
      if(st.wind){if(st.kind==='line'){fwd[1]=1.4*st.pr;up[1]=.1}else if(st.kind==='proj'){up=[1.3,1.3];tick=8}else if(st.kind==='ring'){up=[1.0*st.pr+.25,1.0*st.pr+.25];tick=12*st.pr+1}else if(st.kind==='safe'){up=[2.9*st.pr,2.9*st.pr];hov+=.8*st.pr;tick=20*st.pr+1}}
      if(st.lunge){if(fwd[1]>.5||st.kind==='line'){fwd[1]=1.7}else{up=[.6,.6];lean=.15}}
      if(st.roar){up=[2.6,2.6];tick=15}
      if(st.stagger)lean=Math.sin(t*22)*.15;
      if(st.dead){up=[-.1,-.1];hov=-1.2;lean=.5}
      LPease(c.body.position,'y',hov,dt,6);LPease(c.tor.rotation,'z',-lean,dt,10);
      c.arms.forEach((A,i)=>{LPease(A.pv.rotation,'x',A.sd*up[i],dt,12);LPease(A.pv.rotation,'z',fwd[i],dt,12)});
      const sp=(p2?3:1)*tick;c.hm.rotation.x-=dt*.9*sp;c.hh.rotation.x-=dt*.075*sp;
      c.gears.forEach(G=>G.G.rotation.z+=dt*G.sp*(p2?3:1)*(st.wind?2:1));
      c.crack.scale.y=p2?3:1;c.crack.material.color.set(p2?'#d6b8ff':'#b48cff');
      const s=1+(st.wind?.3*st.pr:0)+Math.sin(t*3)*.05;c.hg.scale.setScalar(s)}};
}

  P.opts.forEach((o,i)=>{if(o.k==='duo'&&o.dk===dk){const used=P.opts.filter(x=>x.k==='duo').map(x=>x.dk),alt=shuffle(Object.keys(DUO).filter(k=>!duoHas(k)&&!md.includes(k)&&!used.includes(k)))[0];
    if(alt)P.opts[i]={k:'duo',dk:alt};else{const ks=Object.keys(RBON).filter(k=>k!=='duo'&&!P.opts.some(x=>x.k===k)&&(!RBON[k].ok||RBON[k].ok()));const k=pick(ks);P.opts[i]=Object.assign({k},RBON[k].mk(run.rush.w))}}});rushPaint()}
function rushGo(){if(!run||!run.rush)return;clearInterval(CO.rpT);const w=run.rush.w+1;if(coRun()&&CO.role==='A')coSend('cnx',{w});rushNext(w)}
function rushNext(w){CO.myPick=0;CO.matePick=0;ui.rpick=null;if(!run||!run.rush)return;run.rush.w=w;rushFight()}
function rushOver(){clearInterval(CO.rpT);const R=run.rush,g=Math.round(R.kills*(30+6*R.kills));meta.souls+=g;meta.rushBest=Math.max(meta.rushBest||0,R.kills);
  ui.rushRes={kills:R.kills,g,best:meta.rushBest,mate:R.role!=='S'&&CO.mate?CO.mate.pseudo:null};run=RUSHSV;RUSHSV=null;fight=null;ui.rpick=null;try{teardown3D()}catch(e){}document.body.style.overflow='';ui.screen='home';ui.hub='arena';save();render()}
function rushPaint(){const st=id('stage');if(!st)return;let el=id('rushp');const P=ui.rpick;if(!P){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='rushp';el.className='rushp';st.appendChild(el)}
  const waitMate=P.chosen>=0&&coRun()&&!(CO.role==='A'?CO.matePick:0);
  el.innerHTML=`<div class="rpin"><span class="label">Gardien vaincu · vague ${run.rush.w+1}</span><h2>Choisis un bonus</h2>
    <div class="rpc">${P.opts.map((o,i)=>{const B=RBON[o.k];return `<button class="rpcard ${o.k==='duo'?'duo':''} ${P.chosen===i?'on':''} ${P.chosen>=0&&P.chosen!==i?'off':''}" data-a="rpick" data-v="${i}" ${P.chosen>=0?'disabled':''}>${o.k==='duo'?'<span class="rptag">Duo</span>':''}<span class="rpi">${o.k==='duo'?DUO[o.dk].i:B.i}</span><b>${esc(B.n(o))}</b>${B.d?`<small>${esc(B.d(o))}</small>`:''}</button>`}).join('')}</div>
    <p class="dim">${P.chosen>=0?(coRun()?(CO.role==='A'?(waitMate?`En attente de ${esc(CO.mate.pseudo)}…`:'Gardien suivant…'):`En attente de ${esc(CO.mate?CO.mate.pseudo:'ton partenaire')}…`):'Gardien suivant…'):`Choix automatique dans ${P.t} s`}</p></div>`}

    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" data-a="pvpquit">Quitter le salon</button></div></section>`;

    case 'heirkeep': {const H=ui.heir,i=+v;if(!H||H.taken.includes(i)||H.taken.length>=H.n||!H.items[i])break;const st=meta.stash||(meta.stash=[]);if(st.length>=HEIRMAX){st.shift();meta.heirSel=(meta.heirSel||[]).map(x=>x-1).filter(x=>x>=0)}const it=Object.assign({},H.items[i]);delete it.heir;st.push(it);H.taken.push(i);save();render()} break;
    case 'heirsel': {const i=+v,S=meta.heirSel||(meta.heirSel=[]);const j=S.indexOf(i);if(j>=0)S.splice(j,1);else if(S.length<2)S.push(i);save();render()} break;
    case 'heirdel': {const i=+v,st=meta.stash||[];if(!st[i])break;st.splice(i,1);meta.heirSel=(meta.heirSel||[]).filter(x=>x!==i).map(x=>x>i?x-1:x);save();render()} break;
    case 'bmnew': {const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];bmConnect(c,'boss')} break;
    case 'bmjoin': {const el=id('bmcode'),c=((el&&el.value)||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);if(c.length===4)bmConnect(c,'hero');else{ui.toast='Le code fait 4 caractères.';render()}} break;
    case 'bmgo': bmStart(); break;
    case 'bmquit': bmQuit(); break;
    case 'bmcopy': try{navigator.clipboard.writeText(BM.code);ui.toast='Code copié : '+BM.code}catch(e){}render(); break;

    case 'tal': {const k=meta.sel;if(!k||run)break;const T=meta.tal||(meta.tal={}),sel=talSel(k);const [b,t]=v.split('-').map(Number);

    case 'coopjoin': {const el=id('coopcode'),c=((el&&el.value)||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);if(c.length===4)coConnect(c,'B');else{ui.toast='Le code fait 4 caractères.';render()}} break;

    case 'pact':{const L=meta.pacts||(meta.pacts=[]);const i=L.indexOf(v);if(i>=0)L.splice(i,1);else L.push(v);save();render()} break;
    case 'again': ui.screen='home';ui.hub='play';ui.pstep=meta.sel&&meta.unlocked[meta.sel]?(talFree()>0?2:3):0;ui.confirm=null;render();window.scrollTo(0,0); break;

    case 'spup':{const sp=spells().find(x=>x.id===v);if(!sp)break;const lv=lvOf(sp),c=spCost(lv);if(unlocked(sp)&&lv<5&&(run.spPts??1)>=c){run.spPts=(run.spPts??1)-c;run.spellLv[v]=lv+1;const S=run.spAlloc||(run.spAlloc={});S[v]=(S[v]||0)+1;save();render()}} break;

    case 'camp': {if(ui.sub!=='camp'||!run)break;if(v==='rest'){const h=healP(Math.round(maxHp()*(SL(4)?.3:.5)));run.flasks=flaskMax();ui.toast=`Tu te reposes : +${h} PV, fioles remplies (${run.flasks} / ${flaskMax()}). Tes ${run.carried} grains restent sur toi.`}else{const b=run.carried;meta.souls+=b;run.carried=0;ui.toast=`${b} grains mis à l’abri au temple. Pas de repos cette fois.`}run.node=null;ui.sub=null;save();render()} break;
    case 'parch': {const n=10+run.floor*2;const add=v==='vit'?n*3:n;run.stats[v]=(run.stats[v]||0)+add;if(v==='vit')run.hp+=add;run.node=null;ui.sub=null;ui.toast=`+${add} ${STATN[v]}.`;save();render()} break;
    case 'confirm': ui.confirm=v;render(); break;
    case 'cancel': ui.confirm=null;render(); break;
    case 'abandon':if(run&&run.endless){endlessEnd('abandon');break}heirSnap();{const kept=Math.floor(run.carried/2),left=run.carried-kept;meta.souls+=kept;ui.end={floor:run.floor,boss:'l’abandon',souls:left,kept,lost:meta.stain?meta.stain.souls:0,mast:gainMast(false)};meta.stain=left>0?{floor:run.floor,souls:left}:null;}meta.runs++;run=null;ui.confirm=null;ui.screen='dead';save();render(); break;
    case 'copysheet':{const S=ui.end&&ui.end.sheet;if(!S)break;const t=sheetText(S),ta=id('sheettxt'),btn=document.querySelector('[data-a=copysheet]');
      const fb=()=>{if(ta){ta.hidden=false;ta.value=t;ta.focus();ta.select()}};
      try{navigator.clipboard.writeText(t).then(()=>{if(btn)btn.textContent='Résumé copié'},fb)}catch(e){fb()}} break;
    case 'reset': try{localStorage.removeItem(KEY)}catch(e){} location.reload(); break;
  }
}
function nextFloor(){run.floor++;seeded(()=>{run.node=makeNodes();run.ev=rollEvent();if((run.floor<=9&&Math.random()<(SL(7)?.2:.06))||(run.endless&&Math.random()<.3))run.mut=run.floor});checkAch();checkSyn();ui.loot=null;ui.sub=null;run.hp=Math.min(run.hp,maxHp());arriveFloor();ui.screen='map';save();render()}
function doNode(k){
  if(k==='repos'){ui.sub='camp';render()}
  else if(k==='forge'){run.spPts=(run.spPts??1)+2;const first=!run.libAdv;run.libAdv=1;run.node=null;ui.toast='+2 points de sort.'+(first?' Tes prochains sorts se débloquent un niveau plus tôt.':'');save();render()}
  else if(k==='divin'){run.wpn=Math.min(5,wRank()+1);run.node=null;ui.toast=`${WPN().god} bénit ${WPN().n} : rang ${run.wpn}.`;save();render()}
  else if(k==='autel'){run.hpPct-=10;run.bonus+=15;run.hp=Math.min(run.hp,maxHp());run.node=null;ui.toast='L’autel prend ta vie et te rend plus fort : −10% PV max, +15% dommages.';save();render()}
  else{ui.sub=k;render()}
}

  ${e.lost?`<p class="down">L’ancienne tache de grains (${e.lost}) est perdue.</p>`:''}${ui.dailyLast?`<p style="color:var(--ember)">Score ${ui.dailyLbl||'de l’ascension du jour'} : ${ui.dailyLast}</p>`:''}
  ${e.lad!=null?`<p class="ladres">Score : <b class="num">${Number(e.lad).toLocaleString('fr-FR')}</b> · <span id="ladst" class="dim">${esc(e.ladSt||'')}</span></p>`:''}${rMast(e.mast)}
  <div class="endbtns"><button class="btn primary big" data-a="again">Nouvelle ascension${talFree()?` <span class="pbadge">${talFree()} talent${talFree()>1?"s":""}</span>`:""}</button><button class="btn big" data-a="home">Menu principal</button></div>${ui.screen==='dead'&&!e.endless?`<p class="etip">💡 ${TIPS[(meta.runs||0)%TIPS.length]}</p>`:''}
  <details class="esheet"><summary>Fiche de l’ascension</summary>${rSheet(e.sheet)}</details></section>`}
function rWin(){const e=ui.end;return `<section class="end win"><span class="label">Le Régent des Heures est tombé</span><h1>LE TEMPS REPREND</h1>${e.nohit?'<p style="color:var(--ember)">Sans dégâts : le Sablier du Régent est à toi. Il t’accompagnera à chaque nouvelle ascension.</p>':''}
  <p>${e.cls} a gravi les neuf étages. ${e.souls} grains rejoignent le temple.</p>${e.daily?`<p style="color:var(--ember)">Score ${e.dLbl||'de l’ascension du jour'} : ${e.daily}</p>`:''}
  ${e.secret?(e.secret.won===1?`<p class="nch" style="font-size:clamp(28px,5vw,48px)">Le Sablier Vivant est vaincu</p><p style="color:var(--ember);font-size:20px">+${e.secret.g} grains au temple${e.secret.nohit?' · sans prendre un coup !':''}</p>`:e.secret.won===0?'<p class="down">Le Sablier Vivant t’a vaincu. Ta victoire contre le Régent reste acquise.</p>':'<p class="dim">Tu as laissé le Sablier Vivant dormir… pour cette fois.</p>'):''}
  <p>Cycle ${ROMAN[e.cycle+1]||e.cycle+1} : les gardiens ont +35% de PV et de dégâts, et frappent plus vite.</p>
  ${e.ascUp?`<p class="nch" style="font-size:clamp(22px,3.4vw,34px)">${SEALS[e.ascUp].n} débloqué</p><p class="dim">${SEALS[e.ascUp].d} Chaque sceau s’ajoute aux précédents et donne +12% de grains.</p>`:''}
  ${e.lad!=null?`<p class="ladres">Score : <b class="num">${Number(e.lad).toLocaleString('fr-FR')}</b> · <span id="ladst" class="dim">${esc(e.ladSt||'')}</span></p>`:''}${rMast(e.mast)}
  ${e.secret&&e.secret.won===1&&ui.endRun?`<div class="endless-ask"><p class="nch" style="font-size:clamp(20px,3vw,30px)">Et maintenant ?</p><p class="dim">Tu peux t’arrêter ici, ou continuer avec ce héros dans la Tour sans fin : gardiens de plus en plus forts, score sans limite.</p><div class="endbtns"><button class="btn primary big" data-a="endlessgo">Gravir la Tour sans fin</button><button class="btn big" data-a="endlessno">M’arrêter là</button></div></div>`:`<div class="endbtns"><button class="btn primary big" data-a="again">Nouvelle ascension${talFree()?` <span class="pbadge">${talFree()} talent${talFree()>1?"s":""}</span>`:""}</button><button class="btn big" data-a="home">Menu principal</button></div>`}${ui.screen==='dead'&&!e.endless?`<p class="etip">💡 ${TIPS[(meta.runs||0)%TIPS.length]}</p>`:''}
  <details class="esheet"><summary>Fiche de l’ascension</summary>${rSheet(e.sheet)}</details></section>`}
function render(){
  tickClock();
  const app=id('app');setTimeout(()=>{if(AU.on)musicFor()},0);
  if(ui.screen==='fight'&&!fight)ui.screen=run?'map':'home';
  if((ui.screen==='map'||ui.screen==='reward')&&!run)ui.screen='home';
  app.classList.toggle('fightmode',ui.screen==='fight');{const hb=ui.screen==='home'?(ui.hub||'menu'):'';app.classList.toggle('wide',hb==='menu'||hb==='play'||ui.screen==='map');app.classList.toggle('mid',!!hb&&hb!=='menu'&&hb!=='play')}
  if(ui.screen!=='fight'){teardown3D();H={}}
  app.innerHTML=({home:rHome,map:rMap,fight:buildFightDom,reward:rReward,dead:rDead,win:rWin,challenger:rChallenger})[ui.screen]();
  if(ui.screen==='fight')bindFight();
  if((ui.screen==='dead'||ui.screen==='win')&&ui.heir){const eb=app.querySelector('section.end .endbtns'),se=app.querySelector('section.end');if(eb)eb.insertAdjacentHTML('beforebegin',heirPanel());else if(se)se.insertAdjacentHTML('afterend',heirPanel())}
  if(ui.screen==='home')ladPaint();
  if(id('aprevc')&&!APV)APV=requestAnimationFrame(auraPrevLoop);
  if(ui.screen==='home'&&!meta.pseudo&&!meta.pseudoAsk){const d=document.createElement('div');d.className='pso';d.innerHTML=`<div class="psin" role="dialog" aria-labelledby="psot"><span class="label">Bienvenue</span><h2 id="psot">Choisis ton pseudo</h2><p class="dim">Il s’affiche dans le classement, en duel et en coop.</p><input id="psoname" maxlength="16" placeholder="Ex. Veilleuse" autocomplete="off" spellcheck="false"><div class="row" style="gap:8px;margin-top:12px;justify-content:center"><button class="btn primary" data-a="pseudook">Valider</button><button class="btn" data-a="pseudolater">Plus tard</button></div><p class="dim" id="psoerr" style="min-height:1.2em;margin:8px 0 0;font-size:13px"></p></div>`;app.appendChild(d);
    const ip=id('psoname');if(ip){setTimeout(()=>ip.focus(),50);ip.addEventListener('keydown',e=>{if(e.key==='Enter')act('pseudook')})}}
  else if(ui.screen==='home'&&!run&&!meta.tutDone&&!meta.tutAsk&&(meta.pseudo||meta.pseudoAsk)){const d=document.createElement('div');d.className='pso';const sure=ui.tutNo;
    d.innerHTML=sure?`<div class="psin" role="dialog"><span class="label">Attends une seconde</span><h2>Haha, t’es sûr ?</h2><p class="dim">Si tu ne fais pas le tuto et que tu viens te plaindre après que c’est trop dur… ça va m’énerver. 😤 Trois minutes, c’est tout.</p><div class="row" style="gap:8px;margin-top:12px;justify-content:center"><button class="btn primary" data-a="tuto">D’accord, je fais le tuto</button><button class="btn" data-a="tutnever">Oui, je gère</button></div></div>`
      :`<div class="psin" role="dialog"><span class="label">Première fois ?</span><h2>Un petit tuto ?</h2><p class="dim">Trois minutes pour apprendre à esquiver, parer, charger tes coups et lancer tes sorts. Ça change tout contre les gardiens.</p><div class="row" style="gap:8px;margin-top:12px;justify-content:center"><button class="btn primary" data-a="tuto">Lancer le tuto</button><button class="btn" data-a="tutno">Non merci</button></div></div>`;app.appendChild(d)}
  if(ui.screen!==ui.last){window.scrollTo(0,0);ui.last=ui.screen}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b.dataset.v)});
load();render();ladInit();
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',kkLoad);else setTimeout(kkLoad,0);
</script>
