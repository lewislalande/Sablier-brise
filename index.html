<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Le Sablier Brisé : roguelite souls-like en 3D dans le navigateur.">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}</style>
</head>
<body>
<title>Le Sablier Brisé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: une colonne étroite façon console ; gestion du perso entre les combats, arène temps réel pendant. Givre et braise, sombre par choix (thème unique). */
:root{
  color-scheme: dark;
  --bg:#111418; --well:#0a0c0f; --panel:#181d23; --panel2:#1f252d; --line:#2c343d;
  --bone:#e3d9c5; --dim:#8f969d; --ember:#d89b47; --blood:#c4483d; --frost:#9fc7d9; --ok:#86b57c;
  --terre:#b98b58; --feu:#e26b43; --air:#88ba76; --eau:#63a0d6;
  --f-disp:"IM Fell English SC","Cormorant SC",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.45}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px;display:flex;flex-direction:column;gap:16px}
#app.fightmode{gap:8px;padding-block:10px 16px;user-select:none;-webkit-user-select:none}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.dim{color:var(--dim)}
.btn{background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:3px;color:var(--bone);text-align:center}
.btn:hover:not(:disabled){border-color:var(--dim)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{border-color:var(--ember);color:var(--ember);background:color-mix(in srgb,var(--ember) 9%,var(--panel2))}
.btn.danger{border-color:var(--blood);color:var(--blood)}
.btn.big{width:100%;padding:14px;font-family:var(--f-disp);font-size:21px;letter-spacing:.04em}
.btn.sm{padding:5px 9px;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar{height:10px;background:var(--well);border:1px solid var(--line);position:relative;overflow:hidden;border-radius:2px}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--blood)}
.bar i.sh{background:var(--frost);opacity:.55}
.bar.ember i{background:var(--ember)}
.bar.stam{height:6px}
.bar.stam i{background:var(--ok)}
.bar.mana{height:6px;margin-top:3px}
.bar.mana i{background:#5b8cff}
.bdg{position:relative;display:inline-flex;flex-shrink:0;align-items:center;gap:6px;font-size:13.5px;padding:4px 10px 6px 4px;border-radius:6px;background:rgba(10,12,16,.82);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-shadow:0 1px 2px #000}
.bdg i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:4px;font-size:14px}
.bdg b{position:absolute;left:0;bottom:0;height:3px;background:currentColor;opacity:.8;transition:width .2s linear}
.bdg.bad{color:#ff8a7a;border-color:#a8433a}.bdg.bad i{background:#a8433a;color:#fff}
.bdg.good{color:#9be08a;border-color:#4f8a45}.bdg.good i{background:#4f8a45;color:#fff}
.bdg.info{color:var(--frost)}.bdg.info i{background:#2a3a48;color:var(--frost)}
.bdg.pop{animation:bdgpop .6s cubic-bezier(.2,1.6,.4,1)}@keyframes bdgpop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:none}}
.chrono{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.chrono span{font-family:var(--f-disp);font-size:30px;color:var(--ember)}.chrono small{color:var(--dim);font-size:13px}.chrono b{color:var(--ok)}
.chip.clock{font-variant-numeric:tabular-nums;color:var(--bone)}
.chbar{position:absolute;left:0;bottom:0;height:4px;width:0;background:#d89b47;transition:width .05s}.chbar.t1{background:#ff9a4a}.chbar.t2{background:#ff6a2a}.chbar.t3{background:#fff1a8;box-shadow:0 0 8px #ffd27a}
.hurtv{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3;background:radial-gradient(ellipse at center,transparent 45%,rgba(200,20,10,.55) 80%,rgba(140,0,0,.85) 100%)}
.stage.lowhp::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 55%,rgba(160,0,0,.45) 100%);animation:lowpulse 1s ease-in-out infinite}
@keyframes lowpulse{50%{opacity:.35}}
.stage.hitflash{animation:hitshake .25s}@keyframes hitshake{20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,0)}}
.bar i.ghost{background:#fff1a8;opacity:.75;transition:none}.bar.big{position:relative}.bar.big i{position:absolute;left:0;top:0;bottom:0}
.challenger .nc{color:#ff6a2a;letter-spacing:.3em;font-size:14px;animation:ncblink 1s steps(2) infinite}@keyframes ncblink{50%{opacity:.3}}
.nch{font-family:var(--f-disp);font-weight:400;font-size:clamp(40px,8vw,92px);letter-spacing:.08em;color:#fff1a8;text-shadow:0 0 30px #e8a040,0 0 60px #ff6a2a;animation:nchin 1.2s cubic-bezier(.2,1.4,.4,1)}@keyframes nchin{from{transform:scale(2.4);opacity:0;filter:blur(8px)}}
.trainp{position:absolute;top:calc(96px + env(safe-area-inset-top,0px));right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;align-items:center;padding:10px 14px;background:rgba(10,12,16,.82);border:1px solid var(--line);border-radius:10px;z-index:1}
.tstats{display:flex;gap:16px;font-size:14px}.tstats b{color:var(--ember);font-size:20px;font-variant-numeric:tabular-nums;margin-left:4px}
.chip{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:20px;color:var(--frost);background:var(--well);white-space:nowrap}
.chip.warn{color:var(--blood);border-color:color-mix(in srgb,var(--blood) 50%,var(--line))}
.chip.good{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.pip{width:9px;height:9px;border-radius:50%;background:var(--c,var(--dim));display:inline-block;flex:none}
.toast{border:1px solid var(--ember);color:var(--ember);padding:10px 12px;border-radius:3px;background:color-mix(in srgb,var(--ember) 8%,var(--bg))}

/* Temple */
.title{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.title .kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ember)}
.title h1{font-size:46px;line-height:1}
.title p{color:var(--dim);max-width:46ch}
.wallet{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.wallet div{display:flex;flex-direction:column;gap:2px}
.wallet b{font-family:var(--f-disp);font-size:24px;font-weight:400}
.cprev{display:grid;place-items:center;background:#0e1114;border-radius:8px;overflow:hidden}.cprev img{width:100%;max-width:560px;display:block}
.pacts,.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.pact{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:9px 11px;border:1px solid var(--line);border-radius:8px}.pact:hover{border-color:var(--dim)}.pact.on{border-color:var(--blood);background:color-mix(in srgb,var(--blood) 10%,transparent)}.pact small,.ach small{font-size:12.5px;color:var(--dim)}.pact:focus-visible{outline:2px solid var(--ember)}
.ach{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;opacity:.7}.ach.done{opacity:1;border-color:var(--ok)}.ach.done b{color:var(--ok)}
.daily{border-color:var(--ember)}
.weekly{border-color:#b48cff}.wmods{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}.wmod{border:1px solid color-mix(in srgb,#b48cff 45%,var(--line));border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,#b48cff 7%,var(--panel))}.wmod b{color:#d6bcff;font-weight:600}.wmod small{font-size:12.5px;color:var(--bone);opacity:.85}.wmod.pact{border-color:color-mix(in srgb,var(--ember) 40%,var(--line));background:color-mix(in srgb,var(--ember) 6%,var(--panel))}.wmod.pact b{color:var(--ember)}
.wcls{display:flex;flex-wrap:wrap;gap:6px}.wcls button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:13px;color:var(--dim)}.wcls button.on{color:var(--bone);border-color:#b48cff;background:color-mix(in srgb,#b48cff 14%,var(--panel2))}

.tali{font-size:12.5px;margin:4px 0 10px}.tpl{color:var(--ember);font-weight:600}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tbr{display:flex;flex-direction:column;align-items:stretch}.tbh{display:flex;flex-direction:column;margin-bottom:6px;min-height:36px}.tbh b{font-family:var(--f-disp);font-size:17px;font-weight:400}.tbh small{font-size:11.5px}
.tnode{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 9px;min-height:96px}
.tnode b{font-size:14px;font-weight:600}.tnode small{font-size:12px;color:var(--dim);line-height:1.3}.tnode em{font-style:normal;font-size:11px;color:var(--dim);margin-top:auto;padding-top:3px;opacity:.85}
.trk{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tnode.can{border-color:color-mix(in srgb,var(--ember) 55%,var(--line))}.tnode.can:hover{background:color-mix(in srgb,var(--ember) 9%,var(--panel2))}
.tnode.on{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 16%,var(--panel2))}.tnode.on small{color:var(--bone)}.tnode.on .trk{color:var(--ember)}
.tnode.off{opacity:.5;cursor:not-allowed}
.tnode.ks{border-style:solid;border-width:1px 1px 1px 3px}.tnode.ks .trk{color:#c9a0ff}.tnode.ks.on{border-color:#c9a0ff;background:color-mix(in srgb,#b48cff 16%,var(--panel2))}.tnode.ks.on .trk{color:#c9a0ff}.tnode.ks.can{border-left-color:#b48cff}
.tlink{display:block;width:2px;height:10px;background:var(--line);margin:0 auto}.tlink.on{background:var(--ember)}
.talchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
@media (max-width:480px){.tnode{padding:7px}.tnode b{font-size:13px}.tnode small{font-size:11.5px}.tbh b{font-size:15px}}


#app.wide{max-width:1060px}#app.mid{max-width:760px}
.pgrid .cprev img{max-height:150px;object-fit:contain}
.mtitle{text-align:center;align-items:center;padding:18px 0 4px}.mtitle h1{font-size:52px}
.mgrid{display:grid;grid-template-columns:1fr;gap:14px}
.mhero{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--ember) 14%,var(--panel)),var(--well));min-height:180px;display:flex;flex-direction:column;justify-content:flex-end}
.mhero img{display:block;width:100%;max-height:260px;object-fit:contain}.mempty{padding:40px 20px;text-align:center;color:var(--dim);font-family:var(--f-disp);font-size:20px;line-height:1.4}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:color-mix(in srgb,var(--well) 70%,transparent)}.mstats span{display:flex;flex-direction:column;align-items:center;padding:8px 4px}.mstats small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}.mstats b{font-size:18px;font-weight:500}
.mnav{display:flex;flex-direction:column;gap:8px}
.mbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 16px;transition:border-color .15s,transform .15s,background .15s}
.mbtn span{display:flex;flex-direction:column;gap:2px;min-width:0}.mbtn b{font-family:var(--f-disp);font-weight:400;font-size:21px;letter-spacing:.02em}.mbtn small{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtn:hover{border-color:var(--dim);transform:translateX(3px)}.mbtn.prim{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 14%,var(--panel))}.mbtn.prim b{color:var(--ember)}
.marr{font-style:normal;color:var(--dim);font-size:24px}.mdot{font-style:normal;background:var(--ember);color:#1a1208;border-radius:12px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px}
.mnote{text-align:center;font-size:13.5px}.mfoot2{justify-content:center}
.hubh{display:flex;align-items:center;gap:12px;padding:4px 0 2px}.hubh>div{flex:1;min-width:0}.hubh h1{font-size:32px;line-height:1.05}.hubh .kicker{font-size:11px}
.hback{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;gap:6px;align-items:center;font-size:15px}.hback:hover{border-color:var(--dim)}
.hwal{color:var(--ember);font-size:15px;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.steps button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 4px;font-size:13px;color:var(--dim);display:flex;gap:6px;align-items:center;justify-content:center}.steps i{font-style:normal;width:18px;height:18px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:11px}
.steps button.on{color:var(--bone);border-color:var(--ember);background:color-mix(in srgb,var(--ember) 12%,var(--panel))}.steps button.done{color:var(--bone)}.steps button.done i{background:var(--ok);border-color:var(--ok);color:#10200c}.steps button:disabled{opacity:.45}
.pgrid{display:flex;flex-direction:column;gap:12px}.pside .create{margin:0}
.pbar{position:sticky;bottom:0;z-index:5;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%)}.pbar .big{flex:1 1 220px}
@media (max-width:480px){.mtitle h1{font-size:40px}.mbtn b{font-size:19px}.steps button{font-size:11.5px;flex-direction:column;gap:2px}}

.arena-act{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.arena-box{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel2)}.arena-box b{font-family:var(--f-disp);font-weight:400;font-size:20px}
.arena-box input{flex:1;min-width:0;background:var(--well);color:var(--bone);border:1px solid var(--line);padding:8px 10px;font:inherit;font-size:18px;letter-spacing:.3em;text-align:center;border-radius:4px}
.arena-wait{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}.arena-code{font-family:var(--f-disp);font-size:64px;letter-spacing:.25em;color:var(--ember);line-height:1.1;padding-left:.25em}
.arena-vs{font-size:28px}.arena-res{text-align:center}.arena-res h2{font-size:40px}.arena-res.win h2{color:var(--ember)}.arena-res.lose h2{color:var(--dim)}

.rbar{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.rb-id{display:flex;flex-direction:column;line-height:1.15}.rb-id b{font-family:var(--f-disp);font-weight:400;font-size:19px}.rb-id small{color:var(--dim);font-size:12px}
.rb-hp{min-width:0}.rb-hp .between{font-size:12.5px;color:var(--dim)}.rb-st{display:flex;gap:12px;font-size:14px;white-space:nowrap}
.rb-fl{grid-column:1/-1;display:flex;gap:4px}.rb-fl i{flex:1;height:4px;border-radius:2px;background:var(--line)}.rb-fl i.done{background:color-mix(in srgb,var(--ok) 70%,var(--line))}.rb-fl i.cur{background:var(--ember);box-shadow:0 0 8px var(--ember)}
.mapgrid{display:flex;flex-direction:column;gap:12px}.mapl,.mapr{display:flex;flex-direction:column;gap:12px;min-width:0}
.bcard{gap:10px}.bcard .kicker{font-size:11px}.bname{font-size:34px;line-height:1.05}.blore{color:var(--dim);font-size:14.5px}
.bperk{font-size:14px;border-left:3px solid var(--c);padding-left:10px}.bperk b{color:var(--c);font-weight:600}
.beff{display:flex;gap:8px;align-items:center;font-size:14px;background:var(--well);border:1px solid var(--line);border-radius:6px;padding:8px 10px}.beff b{font-weight:600}.beff.good{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}.beff.good b{color:var(--ok)}.beff.bad{border-color:color-mix(in srgb,var(--blood) 55%,var(--line))}.beff.bad b{color:var(--blood)}.beff a{color:var(--ember)}
.res4 small{font-size:11.5px;color:var(--dim)}.res4 b{font-size:14px}.res4 .mid b{color:var(--dim)}
.bph{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:color-mix(in srgb,var(--blood) 5%,var(--panel))}.bph summary{cursor:pointer;font-size:14px;color:var(--bone);list-style:none}.bph summary::before{content:'▸ ';color:var(--blood)}.bph[open] summary::before{content:'▾ '}.bph .phl{margin-top:8px}
.bcta{display:flex;flex-direction:column;gap:6px}.bcta .btn:not(.big){font-size:14px;padding:8px}
.mtabs{position:sticky;top:96px;z-index:15;background:var(--bg);margin:0;border-radius:8px 8px 0 0}.mtabs button{font-size:14.5px;padding:11px 4px}
.gport{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}.gport img{width:100%;border-radius:8px;display:block}.gport h3{font-size:22px}
.setd summary{cursor:pointer;color:var(--bone);font-size:14px}.setd[open] summary{margin-bottom:10px}
@media (max-width:480px){.rbar{grid-template-columns:1fr auto;padding:8px 12px}.rb-hp{grid-column:1/-1;order:3}.rb-fl{order:4}.bname{font-size:28px}.mtabs{top:118px}.mtabs button{font-size:12.5px;padding:10px 2px}.res4{grid-template-columns:repeat(2,1fr)}}

.bres{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.bres span{display:flex;align-items:center;gap:5px;background:var(--well);border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 8px;font-size:13px}.bres b{font-weight:600;margin-left:2px}.bres .weak{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}.bres .weak b{color:var(--ok)}.bres .tough{border-color:color-mix(in srgb,var(--blood) 55%,var(--line))}.bres .tough b{color:var(--blood)}.bres .mid b{color:var(--bone)}.bres small{font-size:11.5px;width:100%}
.phl p b{font-family:inherit;font-size:inherit;font-weight:600}
.mapl .bcta{position:sticky;bottom:0;background:linear-gradient(transparent,var(--panel) 18%);padding-top:14px;margin-top:-6px;z-index:2}

/* aléatoire à graine pour l'ascension du jour */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const todaySeed=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
function seeded(fn){if(!run||!run.daily)return fn();const R0=Math.random,g=mulberry(run.daily*31+(run.dstep=(run.dstep||0)+1));Math.random=g;try{return fn()}finally{Math.random=R0}}
function dailySetup(){const g=mulberry(todaySeed()),pk=a=>a[Math.floor(g()*a.length)];const cls=pk(Object.keys(CLASSES)),race=pk(Object.keys(RACES));
  const ps=Object.keys(PACTS).sort(()=>g()-.5).slice(0,2);return {cls,race,pacts:ps}}

const weekSeed=()=>{const W=weekNo();return 1000000+W.y*100+W.w};
function weeklySetup(){const g=mulberry(weekSeed()*7+3);const ks=Object.keys(WMODS).sort(()=>g()-.5);let mods=[ks[0]];for(const k of ks.slice(1)){if(mods.length>=2)break;if((k==='vamp'&&mods.includes('fiole'))||(k==='fiole'&&mods.includes('vamp')))continue;mods.push(k)}
  const pact=Object.keys(PACTS).sort(()=>g()-.5)[0];return {mods,pacts:[pact]}}

/* chaîne articulée (tentacules, racines) : segments emboîtés, pliables un par un */
function LPchain(par,mat,n,L,r0,r1,rad){const T=THREE,segs=[];let parent=par;
  for(let i=0;i<n;i++){const g=new T.Group();if(i>0)g.position.y=L/n;parent.add(g);
    const ra=r0+(r1-r0)*i/n,rb=r0+(r1-r0)*(i+1)/n,geo=new T.CylinderGeometry(rb,ra,L/n*1.06,rad||6);geo.translate(0,L/n/2,0);
    const m=new T.Mesh(geo,mat);m.castShadow=true;m.receiveShadow=true;g.add(m);segs.push(g);parent=g}
  return segs}

/* La Mandragore Mère (étage IV) */
function creatureMandragore(R){
  const T=THREE,g=new T.Group(),wrap=new T.Group(),body=new T.Group();g.add(wrap);wrap.add(body);wrap.scale.setScalar(R/3.6*1.1);
  const bark=LPM('#7a5a3c'),barkD=LPM('#4e3a28'),leaf=LPM('#4f7a32'),leafL=LPM('#76a845'),sh=LPshard();
  const eye=new T.MeshBasicMaterial({color:new T.Color('#b6e07a')});
  const trunk=new T.Group();trunk.position.y=1.3;body.add(trunk);
  const prof=[[0,0],[.55,.25],[1.15,1.0],[1.35,2.0],[1.15,3.0],[.75,3.75],[.35,4.25],[0,4.4]].map(([r,y])=>new T.Vector2(r,y));
  LPadd(trunk,new T.LatheGeometry(prof,7),bark,0,0,0,1,1,.85);
  [[.6,1.6,.7,.5],[-.5,2.4,-.6,.4],[.2,3.2,.65,.35]].forEach(([x,y,z,s])=>LPadd(trunk,new T.IcosahedronGeometry(s,0),barkD,x,y,z));
  const heart=LPadd(trunk,new T.OctahedronGeometry(.3,0),sh,1.2,1.9,0,1,1.9,.9);
  [-1,1].forEach(sd=>{LPadd(trunk,new T.BoxGeometry(.12,.1,.38),eye,1.05,3.05,.38*sd).castShadow=false});
  // couronne de feuilles
  const crown=new T.Group();crown.position.y=4.3;trunk.add(crown);
  const leaves=[];for(let i=0;i<8;i++){const a=i/8*Math.PI*2,pv=new T.Group();pv.rotation.y=a;crown.add(pv);
    const lf=LPadd(pv,new T.ConeGeometry(.35,2.2-(i%2)*.5,4),i%2?leaf:leafL,.35,1.0,0,1,1,.3);lf.rotation.z=-.45-(i%2)*.15;leaves.push(pv)}
  // bras-branches articulés
  const arms=[-1,1].map(sd=>{const pv=new T.Group();pv.position.set(.2,3.2,1.0*sd);trunk.add(pv);pv.rotation.set(sd*1.1,0,0);
    const segs=LPchain(pv,bark,4,3.2,.32,.1,5);
    const tw=LPadd(segs[2],new T.CylinderGeometry(.04,.08,.9,4),barkD,0,.4,.2*sd);tw.rotation.x=sd*-.9;
    LPadd(segs[3],new T.ConeGeometry(.18,.6,4),leaf,0,.9,0,1,1,.4);
    return {pv,segs,sd}});
  // racines-jambes
  const roots=[0,1,2,3].map(i=>{const a=i/4*Math.PI*2+.4,pv=new T.Group();pv.position.set(Math.cos(a)*.45,1.45,Math.sin(a)*.45);body.add(pv);
    pv.rotation.set(-Math.sin(a)*.9,0,Math.cos(a)*.9);const segs=LPchain(pv,barkD,3,1.9,.32,.06,5);segs.forEach((s,j)=>{s.rotation.z=0;s.rotation.x=0});
    segs[0].rotation.x=Math.PI;return {pv,segs,a,ph:i*1.6}});
  return {g,body,trunk,crown,leaves,arms,roots,heart,rocks:[bark,barkD],mat:sh,ground:true,walk:0,
    anim(c,dt,st){const t=st.t;c.walk+=dt*st.spd*.08;const a=Math.min(1,st.spd/40);
      c.roots.forEach(r=>{r.segs[1].rotation.x=Math.sin(c.walk+r.ph)*.4*a;r.segs[2].rotation.x=Math.sin(c.walk+r.ph+1)*.3*a});
      let sway=Math.sin(t*1.3)*.05+Math.sin(c.walk)*.08*a,lean=0,armUp=[0,0],armFwd=[0,0],crownS=1;
      if(st.wind){if(st.kind==='line'){armUp=[.9*st.pr,.9*st.pr];armFwd=[-.6*st.pr,-.6*st.pr];lean=-.12*st.pr}else if(st.kind==='leap'){lean=.15*st.pr;c.trunk.position.y=1.3-.4*st.pr}else lean=.2*st.pr}
      else c.trunk.position.y+=(1.3-c.trunk.position.y)*Math.min(1,dt*8);
      if(st.lunge){armFwd=[1.1,1.1];armUp=[.2,.2];lean=.25}
      if(st.planting){lean=.35}
      if(st.roar){armUp=[1.3,1.3];crownS=1.25;lean=-.2}
      if(st.stagger)sway=Math.sin(t*22)*.25;
      if(st.dead){lean=.6;armUp=[-.4,-.4];crownS=.7}
      LPease(c.trunk.rotation,'x',sway,dt,10);LPease(c.trunk.rotation,'z',-lean,dt,10);
      c.arms.forEach((A,i)=>{LPease(A.pv.rotation,'x',A.sd*(1.1-armUp[i]),dt,14);LPease(A.pv.rotation,'z',-armFwd[i],dt,14);
        A.segs.forEach((s,j)=>{if(j)LPease(s.rotation,'z',-.18-Math.sin(t*2+j)*.06-(st.lunge?.05:0),dt,10)})});
      c.leaves.forEach((l,i)=>{l.children[0].rotation.x=Math.sin(t*2+i)*.08});c.crown.scale.setScalar(crownS);
      const p=1+(st.wind?.3*st.pr:0)+Math.sin(t*3)*.05;c.heart.scale.set(p,1.9*p,.9*p)}};
}

  const head=new T.Group();head.position.set(.5,2.05,0);torso.add(head);

  const eyeS=LPadd(head,new T.BoxGeometry(.1,.12,.55),LPshard(),.45,.15,0);

    const fa=new T.Group();fa.position.set(0,-2.1,.25*sd);pv.add(fa);
    LPadd(fa,new T.BoxGeometry(1.0,1.7,1.0),rock,0,-.8,0);LPadd(fa,dod(.85),rockL,.1,-1.9,0,1.1,1,1.1);
    return {pv,fa,sd}});
  const legs=[-1,1].map((sd,i)=>{const pv=new T.Group();pv.position.set(-.1,2.2,.85*sd);body.add(pv);
    LPadd(pv,new T.BoxGeometry(1.15,2.2,1.1),rock,0,-1.05,0);LPadd(pv,new T.BoxGeometry(1.4,.4,1.3),rockL,.15,-2.05,0);return {pv,ph:i*Math.PI}});
  return {g,body,torso,head,arms,legs,rocks:[rock,rockL],mat:lava,ground:true,walk:0,
    anim(c,dt,st){const t=st.t;c.walk+=dt*st.spd*.06;const a=Math.min(1,st.spd/30);
      c.legs.forEach(L=>LPease(L.pv.rotation,'z',Math.sin(c.walk+L.ph)*.3*a,dt,12));
      let rx=Math.sin(c.walk)*.06*a,rz=0,up=[0,0],fwd=[0,0],elb=[.15,.15],ty=3.6;
      if(st.wind){if(st.kind==='cone'){up[1]=1.4*st.pr;fwd[1]=-.6*st.pr;rz=-.12*st.pr;elb[1]=.8*st.pr}
        else if(st.kind==='drops'||st.kind==='ring'){up=[2.4*st.pr,2.4*st.pr];rz=-.18*st.pr;ty=3.6+.3*st.pr;elb=[.5,.5]}else rz=-.1*st.pr}

/* Mâchevase, la pieuvre des vases (étage VI) */
function creatureMachevase(R){
  const T=THREE,g=new T.Group(),wrap=new T.Group(),body=new T.Group();g.add(wrap);wrap.add(body);wrap.scale.setScalar(R/4.6*1.1);

  const tents=[];for(let i=0;i<8;i++){const a=i/8*Math.PI*2+.2,root=new T.Group();root.position.set(Math.cos(a)*1.6,1.25,Math.sin(a)*1.6);root.rotation.y=-a;body.add(root);

    anim(c,dt,st){const t=st.t;c.walk+=dt*st.spd*.05;const a=Math.min(1,st.spd/30);
      let lift=0,curl=.22,wave=.18,mz=Math.sin(t*1.1)*.04,my=1.4+Math.sin(t*1.6)*.08,spread=0,pulse=1;

      c.tents.forEach((T2,i)=>{LPease(T2.base.rotation,'z',-1.8+(T2.front?lift:lift*.3)+spread,dt,12);

function creatureRegent(R){

  LPadd(head,new T.TorusGeometry(.98,.09,6,24),brass,0,0,0).rotation.y=Math.PI/2;
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;LPadd(head,new T.BoxGeometry(.05,i%3?.08:.18,.05),robe,.11,Math.cos(a)*.78,Math.sin(a)*.78).rotation.x=-a}
  const hh=new T.Group();hh.position.x=.13;head.add(hh);const hm=new T.Group();hm.position.x=.14;head.add(hm);

  // bras-aiguilles
  const arms=[-1,1].map(sd=>{const pv=new T.Group();pv.position.set(0,1.5,1.05*sd);tor.add(pv);
    LPadd(pv,new T.CylinderGeometry(.14,.1,1.0,5),robeL,0,-.45,0);
    const nd=LPadd(pv,new T.ConeGeometry(.13,3.6,4),brass,0,-2.6,0);nd.rotation.x=Math.PI;return {pv,sd}});
  // engrenages flottants dans le dos

    LPadd(G,new T.TorusGeometry(s,s*.22,5,14),brass);for(let k=0;k<8;k++){const a=k/8*Math.PI*2;LPadd(G,new T.BoxGeometry(s*.3,s*.35,s*.25),brass,Math.cos(a)*s*1.15,Math.sin(a)*s*1.15,0).rotation.z=a}return {G,sp}});

function act(a,v){
  switch(a){
    case 'sel': if(meta.unlocked[v]){meta.sel=v;save();render();kkHero(v)} break;
    case 'race': if(v==='__rand'){const ks=Object.keys(RACES).filter(k=>k!==meta.race);meta.race=pick(ks)}else if(RACES[v])meta.race=v;save();render(); break;

    case 'inf':if(v==='none'||meta.infU[v]){run.inf=v==='none'?null:v;PORT.key='';save();render()} break;
    case 'upg': {const u=UPG.find(x=>x.k===v),l=meta.up[v];if(l<u.max&&meta.souls>=u.cost(l)){meta.souls-=u.cost(l);meta.up[v]++;save();render()}} break;
    case 'start': if(run){ui.screen='map';render()}else if(meta.sel&&meta.unlocked[meta.sel])newRun(); break;
    case 'daily': if(!run)newRun(true); break;
    case 'weekly': if(!run)newRun('week'); break;
    case 'wcls': meta.wcls=v;save();render(); break;
    case 'pvpnew': {const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];pvpConnect(c,'A')} break;
    case 'pvpjoin': {const el=id('pvpcode'),c=((el&&el.value)||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);if(c.length===4)pvpConnect(c,'B');else{ui.toast='Le code fait 4 caractères.';render()}} break;
    case 'pvpgo': pvpHostStart(true); break;

    case 'pact':{const L=meta.pacts||(meta.pacts=[]);const i=L.indexOf(v);if(i>=0)L.splice(i,1);else L.push(v);save();render()} break;

    case 'hub': ui.hub=v;ui.confirm=null;if(v==='play'&&ui.pstep==null)ui.pstep=meta.sel&&meta.unlocked[meta.sel]?1:0;render();window.scrollTo(0,0); break;
    case 'pstep': ui.pstep=+v;render();window.scrollTo(0,0); break;
    case 'path':{const O=run.pathOff;if(!O||!needPath())break;const o=O.opts[+v],q=O.opts[1-v],fl=run.floor;run.order[fl-1]=o.i;run.order[fl]=q.i;run.paths[fl]=o.perk;run.pathOff=null;
      let m=`${PERKS[o.perk].n} : tu affrontes ${BOSSES[o.i].name}.`;if(o.perk==='soin'){run.hp=maxHp();run.flasks=Math.max(run.flasks,flaskMax())}if(o.perk==='savoir')run.spPts=(run.spPts??1)+2;if(o.perk==='mut')run.mut=fl;ui.toast=m;save();render()} break;
    case 'fullscreen':{try{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen).call(d);setTimeout(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(_){}},300)}catch(_){}} break;
    case 'gfx': meta.gfx=v==='basse'?'basse':'haute';save();render(); break;
    case 'asc': meta.ascSel=Math.max(0,Math.min(meta.ascMax||0,+v));save();render(); break;
    case 'fight': if(needPath()){render();break}if(unspent()&&ui.confirm!=='unspent'){ui.confirm='unspent';render();break}ui.confirm=null;startFight(); break;
    case 'autopts':{const k=topStat();run.stats[k]=(run.stats[k]||0)+run.pts;run.pts=0;save();render()} break;
    case 'goto':{ui.confirm=null;if(v==='sec-stats'||v==='sec-spells'){ui.ptab=v==='sec-stats'?'stats':'spells';v='sec-prog'}render();const el=document.getElementById(v);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})} break;
    case 'pt': {const [k,nn]=v.split(':');const n=nn==='all'?run.pts:Math.min(+nn,run.pts);if(n<1)break;run.pts-=n;const add=k==='vit'?n*3:n;run.stats[k]=(run.stats[k]||0)+add;if(k==='vit')run.hp+=add;const A=run.alloc||(run.alloc={});A[k]=(A[k]||0)+n;save();render()} break;
    case 'ptm': {const A=run.alloc||(run.alloc={}),k=v,n=Math.min(1,A[k]||0);if(n<1)break;A[k]-=n;run.pts+=n;const add=k==='vit'?n*3:n;run.stats[k]=(run.stats[k]||0)-add;if(k==='vit')run.hp=Math.max(1,Math.min(maxHp(),run.hp-add));save();render()} break;
    case 'ptreset': {const A=run.alloc||{};for(const k in A){const n=A[k];if(!n)continue;run.pts+=n;const add=k==='vit'?n*3:n;run.stats[k]=(run.stats[k]||0)-add;if(k==='vit')run.hp=Math.max(1,Math.min(maxHp(),run.hp-add))}run.alloc={};save();render()} break;
    case 'ptab': ui.ptab=v;render(); break;
    case 'mtab': ui.ptab=v;render();{const el=id('sec-prog');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})} break;
    case 'spdown':{const sp=spells().find(x=>x.id===v),S=run.spAlloc||(run.spAlloc={});if(!sp||!S[v])break;const lv=lvOf(sp);if(lv<=1)break;run.spellLv[v]=lv-1;run.spPts=(run.spPts??1)+spCost(lv-1);S[v]--;save();render()} break;
    case 'take': {const [iv,fk]=String(v).split('|');const it=ui.loot[+iv];const k=slotKey(it,fk);const old=run.items[k];const dv=(it.stats.vit||0)-(old?old.stats.vit||0:0);run.items[k]=it;checkSyn();run.hp=Math.max(1,Math.min(maxHp(),run.hp+Math.max(0,dv)));nextFloor()} break;
    case 'skip': nextFloor(); break;
    case 'gotok': {const G=ui.got;ui.got=null;if(v==='equip'&&G&&G.kind==='weapon'){run.wsel=G.k;PORT.key='';save()}render()} break;
    case 'node': doNode(v); break;
    case 'wsel': run.wsel=v==='base'?null:v;PORT.key='';save();render(); break;
    case 'evc':{const E=EVENTS[run.ev];if(!E)break;const c=E.ch[+v];if(!c||(c.ok&&c.ok()!==true))break;const r=c.fx();if(r&&r.keep){ui.toast=r.msg;render();break}if(r&&r.fight){run.ev=null;save();startFight();break}(run.evSeen||(run.evSeen=[])).push(run.ev);run.ev=null;checkSyn();if(r&&r.got){ui.got=r.got;ui.toast=r.msg}else ui.toast=r&&r.msg?r.msg:r;save();render();scrollTo(0,0)} break;
    case 'spup':{const sp=spells().find(x=>x.id===v);if(!sp)break;const lv=lvOf(sp),c=spCost(lv);if(unlocked(sp)&&lv<5&&(run.spPts??1)>=c){run.spPts=(run.spPts??1)-c;run.spellLv[v]=lv+1;const S=run.spAlloc||(run.spAlloc={});S[v]=(S[v]||0)+1;save();render()}} break;

    case 'confirm': ui.confirm=v;render(); break;
    case 'cancel': ui.confirm=null;render(); break;
    case 'abandon':if(run&&run.endless){endlessEnd('abandon');break}{const kept=Math.floor(run.carried/2),left=run.carried-kept;meta.souls+=kept;ui.end={floor:run.floor,boss:'l’abandon',souls:left,kept,lost:meta.stain?meta.stain.souls:0,mast:gainMast(false)};meta.stain=left>0?{floor:run.floor,souls:left}:null;}meta.runs++;run=null;ui.confirm=null;ui.screen='dead';save();render(); break;

  }
}
function nextFloor(){run.floor++;seeded(()=>{run.node=makeNodes();run.ev=rollEvent();if((run.floor<=9&&Math.random()<(SL(7)?.2:.06))||(run.endless&&Math.random()<.3))run.mut=run.floor});checkAch();checkSyn();ui.loot=null;ui.sub=null;run.hp=Math.min(run.hp,maxHp());arriveFloor();ui.screen='map';save();render()}
function doNode(k){
  if(k==='repos'){const h=healP(Math.round(maxHp()*(SL(4)?.3:.5)));run.flasks=flaskMax();const b=run.carried;meta.souls+=b;run.carried=0;run.node=null;
    ui.toast=`Tu te reposes : +${h} PV, fioles remplies${b?`, ${b} grains mis à l’abri`:''}.`;save();render()}
  else if(k==='forge'){run.spPts=(run.spPts??1)+2;run.node=null;ui.toast='+2 points de sort.';save();render()}
  else if(k==='divin'){run.wpn=Math.min(5,wRank()+1);run.node=null;ui.toast=`${WPN().god} bénit ${WPN().n} : rang ${run.wpn}.`;save();render()}
  else if(k==='autel'){run.hpPct-=10;run.bonus+=15;run.hp=Math.min(run.hp,maxHp());run.node=null;ui.toast='L’autel prend ta vie et te rend plus fort : −10% PV max, +15% dommages.';save();render()}
  else{ui.sub=k;render()}
}

function codexHtml(){const C=cx(),bs=BOSSES,nB=bs.length*2+bs.length-1,gB=bs.reduce((a,b)=>a+(C.boss[b.id]?.w?1:0)+(C.boss[b.id]?.nh?1:0)+(b.id!=='secret'&&C.boss[b.id]?.mut?1:0),0),

  const tower=`<section class="panel"><span class="label">L’ascension</span>${run.endless?`<div class="fl cur" style="margin:6px 0"><span class="rn">${ROMAN[run.floor]}</span><span>Tour sans fin · ${esc(BOSSAT(run.floor).name)} <small class="dim">(+${Math.round(20*(run.floor-9))}% PV et dégâts)</small></span></div>`:''}<div class="tower">${[9,8,7,6,5,4,3,2,1].map(n=>{const b=BOSSAT(n),pr=n%2?n:n-1,open=n<9&&n>=run.floor&&!(run.paths||{})[pr]&&run.order;const alt2=open?(n%2?BOSSES[n]:BOSSES[n-2]):null;const cls=n<run.floor?'done':n===run.floor?'cur':'';const stain=meta.stain&&meta.stain.floor===n;return `<div class="fl ${cls}"><span class="rn">${ROMAN[n]}</span><span>${open?`${b.name} <span class="dim">ou</span> ${alt2.name}`:b.name}${run.mut===n&&n>=run.floor?' <span class="chip mutc">Corrompu</span>':''}</span><span class="tag">${stain?`<span class="chip" style="color:var(--ember)">${meta.stain.souls} grains</span>`:n<run.floor?'vaincu':n===run.floor?'prochain':''}</span></div>`}).join('')}</div></section>
    <details class="panel setd"><summary>Son, touches et graphismes</summary>${ctrlHtml()}</details>`;
  const gear=`<section class="panel gport"><div class="gport-i">${(()=>{const u=portrait(run);return u?`<img src="${u}" alt="Ton ${CLS().name} et son équipement">`:''})()}</div><div><span class="label">Ton héros</span><h3>${RC().n} ${CLS().name}</h3><p class="dim">Niveau ${run.lvl} · ${maxHp()} PV · ${critC()}% de critique</p>${talAct().length?`<div class="talchips">${talAct().map(N=>`<span class="chip" title="${esc(N.d)}" style="${N.k?'color:#c9a0ff':''}">${N.k?'◆ ':''}${N.n}</span>`).join('')}</div>`:''}</div></section>${rWeapon()}${rGear()}`;
  const body=tab==='spells'?`<section class="panel">${rSpellsP()}</section>`:tab==='stats'?`<section class="panel">${rStatsP()}</section>`:tab==='gear'?gear:tower;
  return `${toast}
  <div class="rbar"><div class="rb-id"><b>${CLS().name}</b><small>${RC().n} · niveau ${run.lvl}</small></div>
    <div class="rb-hp"><div class="between num"><span>PV</span><span>${run.hp} / ${maxHp()}</span></div>${bar(run.hp,maxHp(),'ember')}</div>
    <div class="rb-st num"><span title="Fioles de soin">⚗ ${run.flasks}/${flaskMax()}</span><span title="Grains sur toi (mets-les à l’abri au Feu de camp)">⏳ ${run.carried}</span></div>
    <div class="rb-fl" title="Ta progression dans la tour">${[1,2,3,4,5,6,7,8,9].map(n=>`<i class="${n<run.floor?'done':n===run.floor?'cur':''}"></i>`).join('')}</div></div>
  ${pop}
  <div class="mapgrid"><div class="mapl">${center}</div>
   <div class="mapr" id="sec-prog"><div class="ptabs mtabs" role="tablist">${TB.map(([k,n,c])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" data-a="ptab" data-v="${k}">${n}${c?`<span class="pbadge">${c}</span>`:''}</button>`).join('')}</div>${body}</div></div>
  ${ui.confirm==='abandon'?`<div class="confirm"><p>Abandonner compte comme une mort : la moitié de tes grains rejoint le temple, l’autre reste à l’étage ${ROMAN[run.floor]}.</p><div class="row"><button class="btn danger" data-a="abandon">Abandonner</button><button class="btn" data-a="cancel">Continuer</button></div></div>`:''}
  <footer><button data-a="home">Menu principal</button><button data-a="confirm" data-v="abandon">Abandonner l’ascension</button></footer>`;
}
function heroSnap(){const w=WPN(),ds=spells().filter(x=>['dmg','leap','nova','order','trap'].includes(x.t)&&x.el);return {pv:maxHp(),dmg:Math.round(dmgBase(wpnSp(false),(w.min+w.max)/2*wMult(),1)),sp:ds.length?Math.round(ds.reduce((a,x)=>a+dmgBase(x,(x.min+x.max)/2,lvOf(x)),0)/ds.length):0,crit:critC(),res:resT(),end:stMax(),soin:itemSum('soin')}}
function withItem(it,fn){const k=slotKey(it),old=run.items[k];run.items[k]=it;try{return fn()}finally{if(old)run.items[k]=old;else delete run.items[k]}}
const SNAPN={pv:['PV max',''],dmg:['Coup d’arme',''],sp:['Sorts (moyenne)',''],crit:['Critique','%'],res:['Résistance','%'],end:['Endurance',''],soin:['Soins','']};
function itemImpact(it){const a=heroSnap(),c0=setCounts(),b=withItem(it,heroSnap),c1=withItem(it,setCounts);
  const rows=Object.keys(SNAPN).filter(k=>a[k]!==b[k]).map(k=>({k,a:a[k],b:b[k],d:b[k]-a[k],pc:a[k]?Math.round((b[k]-a[k])/a[k]*100):0}));
  const sets=[];new Set([...Object.keys(c0),...Object.keys(c1)]).forEach(id=>{const S=SETS[id];if(!S)return;[2,3,4].forEach(t=>{const x=c0[id]||0,y=c1[id]||0;
    if(x<t&&y>=t)sets.push({ok:1,txt:`${S.n} ${t}/4 : `+Object.entries(setB(S,t)).map(([k,v])=>`+${v} ${STATN[k]}`).join(', ')});
    if(x>=t&&y<t)sets.push({ok:0,txt:`Perdu : ${S.n} ${t}/4`})})});
  return {rows,sets}}
function lootScore(it){const im=itemImpact(it),W={pv:1,dmg:1.6,sp:1.2,crit:1,res:1,end:.5,soin:.4};return (it.alt?8:0)+(it.leg?6:0)+im.rows.reduce((a,r)=>a+(r.pc||Math.sign(r.d)*5)*(W[r.k]||1),0)+im.sets.reduce((a,x)=>a+(x.ok?15:-15),0)}
function lootBest(){const L=ui.loot||[];if(L.length<2)return -1;const sc=L.map(lootScore);const m=Math.max(...sc);return m>4?sc.indexOf(m):-1}
function lootCard(it,i,best){const k=slotKey(it),old=run.items[k],im=itemImpact(it),img=ui.lootImg&&ui.lootImg[i];
  const rar=it.alt?['Altération',ALTCOL]:it.leg?(it.tier==='ep'?['Épique','#b48cff']:['Légendaire','#e8b04a']):it.set?['Panoplie',SETS[it.set].col]:['Commun','#8f969d'];
  const keys=[...new Set([...Object.keys(it.stats),...Object.keys(old?old.stats:{})])];
  const diff=keys.map(st=>({st,d:(it.stats[st]||0)-(old&&old.stats[st]||0)})).filter(x=>x.d!==0).sort((a,b)=>b.d-a.d);
  const gain=diff.filter(x=>x.d>0),lose=diff.filter(x=>x.d<0);
  const W={pv:1,dmg:1.6,sp:1.2,crit:1,res:1,end:.5,soin:.4},score=im.rows.reduce((a,r)=>a+(r.pc||Math.sign(r.d)*5)*(W[r.k]||1),0)+im.sets.reduce((a,x)=>a+(x.ok?15:-15),0);
  const neg=im.rows.some(r=>r.d<0)||im.sets.some(x=>!x.ok),pos=im.rows.some(r=>r.d>0)||im.sets.some(x=>x.ok);
  const syn=it.alt?Object.keys(SYNS).filter(k=>SYNS[k].a.includes(it.alt)&&SYNS[k].a.every(a=>a===it.alt||hasA(a))):[];
  const v=it.alt?['Nouveau pouvoir','up','✦']:!neg&&!pos?['Sans effet','mid','•']:!neg&&pos?['Amélioration','up','▲']:score>5?['Échange favorable','mid','◆']:score<-5||!pos?['Moins bon','down','▼']:['Échange','mid','◆'];
  return `<div class="lc ${it.leg&&it.tier!=='ep'?'legend':''}" style="--rc:${rar[1]};--i:${i}">
    <div class="lc-top"><span class="lc-rar">${rar[0]}</span>${best===i?'<span class="lc-best">★ Conseillé</span>':''}<span class="lc-slot">${k==='Anneau 2'?'Anneau (2e)':it.slot}</span></div>
    <div class="lc-img">${img?`<img src="${img}" alt="Ton héros avec ${esc(it.name)}">`:''}<span class="lc-verdict ${v[1]}">${v[2]} ${v[0]}</span></div>
    <h3>${esc(it.name)}</h3>
    ${it.d?`<p class="lc-pow">${it.d}</p>`:''}${syn.length?`<p class="lc-syn">✦ Synergie inconnue possible avec ce que tu portes…</p>`:''}${it.set?`<p class="lc-set" style="color:${SETS[it.set].col}">${SETS[it.set].n} · ${withItem(it,setCounts)[it.set]}/4 une fois équipé</p>`:''}
    <div class="lc-rep">${old?`Remplace <b>${esc(old.name)}</b>`:'<span class="up">Emplacement libre : tu ne perds rien</span>'}</div>
    <div class="lc-cols"><div><span class="lc-h up">Tu gagnes</span>${gain.length?gain.map(x=>`<span class="up">+${x.d} ${STATN[x.st]}</span>`).join(''):'<span class="dim">—</span>'}</div>
      <div><span class="lc-h down">Tu perds</span>${lose.length?lose.map(x=>`<span class="down">${x.d} ${STATN[x.st]}</span>`).join(''):'<span class="dim">rien</span>'}</div></div>
    <div class="lc-fx"><span class="lc-h">Sur ton héros</span>${im.rows.length?im.rows.map(r=>`<div class="lc-row"><span>${SNAPN[r.k][0]}</span><span class="num">${r.a}${SNAPN[r.k][1]} → <b>${r.b}${SNAPN[r.k][1]}</b></span><span class="num ${r.d>0?'up':'down'}">${r.d>0?'+':''}${r.d}${SNAPN[r.k][1]}${r.pc&&SNAPN[r.k][1]===''?` (${r.pc>0?'+':''}${r.pc}%)`:''}</span></div>`).join(''):'<span class="dim">Aucun effet sur tes coups</span>'}
      ${im.sets.map(x=>`<div class="lc-row set ${x.ok?'up':'down'}">${x.ok?'▲ Bonus gagné : ':'▼ '}${x.txt.replace(/^Perdu : /,'Bonus perdu : ')}</div>`).join('')}</div>
    ${it.slot==='Anneau'&&run.items.Anneau&&run.items['Anneau 2']?`<div class="lc-btns"><button class="btn primary sm" data-a="take" data-v="${i}|Anneau">Remplacer ${esc(run.items.Anneau.name)}</button><button class="btn primary sm" data-a="take" data-v="${i}|Anneau 2">Remplacer ${esc(run.items['Anneau 2'].name)}</button></div>`
      :`<button class="btn primary lc-take" data-a="take" data-v="${i}">Équiper${k==='Anneau 2'?' (2e anneau)':''}</button>`}</div>`}
function rReward(){
  return `<section class="end win" style="padding-block:20px 0"><span class="label">Étage ${ROMAN[run.floor]} vaincu</span><h1>Victoire</h1>
    ${ui.nohit?`<p style="color:var(--ember);font-family:var(--f-disp);font-size:22px">Sans dégâts ! ${ui.nohit==='owned'?'Tu possèdes déjà son légendaire.':'Légendaire garanti : '+LEG.find(x=>x.id===ui.nohit).n+' · grains doublés'}</p>`:''}
    ${ui.newInf?`<p style="color:${INF[ui.newInf].col};font-family:var(--f-disp);font-size:22px">Infusion débloquée : ${INF[ui.newInf].n}</p>`:''}
    ${ui.newW?`<p style="color:${WEAPONS[ui.newW].glowHex};font-family:var(--f-disp);font-size:22px">Arme légendaire : ${WEAPONS[ui.newW].n} (${EL[WEAPONS[ui.newW].el].n}) — dans ton arsenal</p>`:''}
    ${ui.wagerWon?'<p style="color:var(--ember)">Pari gagné : grains doublés et une pièce de plus au choix.</p>':''}
    ${ui.mutWon?'<p style="color:#ff5c8a;font-family:var(--f-disp);font-size:20px">Gardien corrompu vaincu : grains ×2, Altération dans le butin.</p>':''}${ui.speedRes?`<p style="color:var(--ember)">${ui.speedRes}</p>`:''}
    <p>+${ui.gain} grains sur toi. Niveau ${run.lvl} : +5 points de caractéristiques, +1 point de sort.</p>${ui.newSp&&ui.newSp.length?`<p style="color:var(--ember)">Nouveau sort débloqué : ${ui.newSp.join(', ')}</p>`:''}</section>
  <section class="panel lootwide"><div class="between"><span class="label">Butin : choisis une pièce</span><span class="dim" style="font-size:13px">Comparé à ce que tu portes maintenant</span></div><div class="loot3">${(()=>{const bi=lootBest();return ui.loot.map((it,i)=>lootCard(it,i,bi)).join('')})()}</div>
    <button class="btn" data-a="skip">Ne rien prendre</button></section>`;
}
function rChallenger(){return `<section class="end challenger"><span class="label nc">Un nouveau défi apparaît</span>
  <h1 class="nch">LE SABLIER VIVANT</h1><p>Le Régent tombe… et le sablier se brise pour de bon. Ce qui dormait dedans s’éveille.</p>
  <p class="dim">Ta victoire est déjà enregistrée et tes grains sont au temple. Ce combat est un bonus : <b style="color:var(--ember)">${Math.round(1500*(1+meta.cycle*.5)*(1+.15*heatOf(run.pacts)))} grains</b> si tu gagnes, le double sans prendre un coup. Tu perds seulement le bonus si tu tombes.</p>
  <p class="dim">PV remontés à 60% au moins, fioles remplies.</p>
  <div class="row" style="justify-content:center;gap:10px"><button class="btn primary big" data-a="secretgo">Affronter le Sablier Vivant</button><button class="btn big" data-a="endless">Gravir la Tour sans fin</button><button class="btn" data-a="secretno">Rentrer au temple</button></div>
  <p class="dim" style="margin-top:10px;font-size:13.5px"><b style="color:var(--bone)">Tour sans fin</b> : les gardiens reviennent dans le désordre, +20% de PV et de dégâts à chaque étage, souvent corrompus. Tu gardes ton personnage, tes grains gagnés là-haut sont à toi même si tu tombes, et chaque étage franchi vaut +1500 au classement.</p></section>`}
function rMast(M){if(!M)return '';const C=CLASSES[M.cls],lv=M.lv1,nx=MAST[lv];return `<div class="mastend"><span class="label">Maîtrise · ${C.name}</span><p><b style="color:var(--ember)">+${M.xp} XP</b> · niveau ${ROMAN[lv]||0}${nx?` · ${M.tot}/${nx.xp} vers : ${nx.d}`:' · maîtrise complète'}</p>${M.news.length?`<p class="up">Niveau de maîtrise atteint ! Débloqué : ${M.news.join(' · ')}</p>`:''}</div>`}
const TIPS=['Une roulade rend invulnérable un court instant : roule à travers l’attaque, pas en arrière.','Après une grosse attaque, le gardien reste ouvert : c’est le moment de frapper fort.','Regarde les faiblesses du gardien avant d’entrer : un élément qu’il encaisse mal fait bien plus mal.','Garde de l’endurance pour esquiver : ne la vide jamais complètement.','Une parade au dernier moment (parfaite) ne coûte rien et déséquilibre le gardien.','Le Feu de camp met tes grains à l’abri : utile avant un gardien difficile.','La moitié de tes grains reste à l’étage où tu tombes : reviens la chercher.'];
function rDead(){const e=ui.end;if(e.endless)return `<section class="end dead"><span class="label">Tour sans fin</span><h1>ÉTAGE ${ROMAN[e.floor]}</h1>
  <p>${e.boss==='l’abandon'?'Tu redescends de la tour':'Tombé face à '+esc(e.boss)} après ${Math.max(0,e.floor-10)} étage${e.floor-10>1?'s':''} franchi${e.floor-10>1?'s':''} au-delà du Régent.${(meta.endBest||0)<=e.floor?' <b style="color:var(--ember)">Record personnel !</b>':''}</p>
  <p style="color:var(--ok)">Tes ${e.kept} grains gagnés dans la tour rejoignent le temple.</p>
  ${e.lad!=null?`<p class="ladres">Score : <b class="num">${Number(e.lad).toLocaleString('fr-FR')}</b> · <span id="ladst" class="dim">${esc(e.ladSt||'')}</span></p>`:''}${rMast(e.mast)}
  <div class="endbtns"><button class="btn primary big" data-a="again">Nouvelle ascension</button><button class="btn big" data-a="home">Menu principal</button></div>${ui.screen==='dead'&&!e.endless?`<p class="etip">💡 ${TIPS[(meta.runs||0)%TIPS.length]}</p>`:''}
  <details class="esheet"><summary>Fiche de l’ascension</summary>${rSheet(e.sheet)}</details></section>`;return `<section class="end dead"><h1>TU ES MORT</h1>
  <p>Tombé à l’étage ${ROMAN[e.floor]} face à ${esc(e.boss)}.</p>
  ${e.kept?`<p style="color:var(--ok)">La moitié de tes grains (${e.kept}) rejoint le temple : tu peux les dépenser dès maintenant.</p>`:''}
  ${e.souls?`<p>${e.souls} grains sont restés à l’étage ${ROMAN[e.floor]}. Atteins-le à nouveau pour les récupérer.</p>`:'<p>Tu n’avais aucun grain sur toi.</p>'}
  ${e.lost?`<p class="down">L’ancienne tache de grains (${e.lost}) est perdue.</p>`:''}${ui.dailyLast?`<p style="color:var(--ember)">Score ${ui.dailyLbl||'de l’ascension du jour'} : ${ui.dailyLast}</p>`:''}
  ${e.lad!=null?`<p class="ladres">Score : <b class="num">${Number(e.lad).toLocaleString('fr-FR')}</b> · <span id="ladst" class="dim">${esc(e.ladSt||'')}</span></p>`:''}${rMast(e.mast)}
  <div class="endbtns"><button class="btn primary big" data-a="again">Nouvelle ascension</button><button class="btn big" data-a="home">Menu principal</button></div>${ui.screen==='dead'&&!e.endless?`<p class="etip">💡 ${TIPS[(meta.runs||0)%TIPS.length]}</p>`:''}
  <details class="esheet"><summary>Fiche de l’ascension</summary>${rSheet(e.sheet)}</details></section>`}
function rWin(){const e=ui.end;return `<section class="end win"><span class="label">Le Régent des Heures est tombé</span><h1>LE TEMPS REPREND</h1>${e.nohit?'<p style="color:var(--ember)">Sans dégâts : le Sablier du Régent est à toi. Il t’accompagnera à chaque nouvelle ascension.</p>':''}
  <p>${e.cls} a gravi les neuf étages. ${e.souls} grains rejoignent le temple.</p>${e.daily?`<p style="color:var(--ember)">Score ${e.dLbl||'de l’ascension du jour'} : ${e.daily}</p>`:''}
  ${e.secret?(e.secret.won===1?`<p class="nch" style="font-size:clamp(28px,5vw,48px)">Le Sablier Vivant est vaincu</p><p style="color:var(--ember);font-size:20px">+${e.secret.g} grains au temple${e.secret.nohit?' · sans prendre un coup !':''}</p>`:e.secret.won===0?'<p class="down">Le Sablier Vivant t’a vaincu. Ta victoire contre le Régent reste acquise.</p>':'<p class="dim">Tu as laissé le Sablier Vivant dormir… pour cette fois.</p>'):''}
  <p>Cycle ${ROMAN[e.cycle+1]||e.cycle+1} : les gardiens ont +35% de PV et de dégâts, et frappent plus vite.</p>
  ${e.ascUp?`<p class="nch" style="font-size:clamp(22px,3.4vw,34px)">${SEALS[e.ascUp].n} débloqué</p><p class="dim">${SEALS[e.ascUp].d} Chaque sceau s’ajoute aux précédents et donne +12% de grains.</p>`:''}
  ${e.lad!=null?`<p class="ladres">Score : <b class="num">${Number(e.lad).toLocaleString('fr-FR')}</b> · <span id="ladst" class="dim">${esc(e.ladSt||'')}</span></p>`:''}${rMast(e.mast)}
  <div class="endbtns"><button class="btn primary big" data-a="again">Nouvelle ascension</button><button class="btn big" data-a="home">Menu principal</button></div>${ui.screen==='dead'&&!e.endless?`<p class="etip">💡 ${TIPS[(meta.runs||0)%TIPS.length]}</p>`:''}
  <details class="esheet"><summary>Fiche de l’ascension</summary>${rSheet(e.sheet)}</details></section>`}
function render(){
  tickClock();
  const app=id('app');setTimeout(()=>{if(AU.on)musicFor()},0);
  if(ui.screen==='fight'&&!fight)ui.screen=run?'map':'home';
  if((ui.screen==='map'||ui.screen==='reward')&&!run)ui.screen='home';
  app.classList.toggle('fightmode',ui.screen==='fight');{const hb=ui.screen==='home'?(ui.hub||'menu'):'';app.classList.toggle('wide',hb==='menu'||hb==='play'||ui.screen==='map');app.classList.toggle('mid',!!hb&&hb!=='menu'&&hb!=='play')}
  if(ui.screen!=='fight'){teardown3D();H={}}
  app.innerHTML=({home:rHome,map:rMap,fight:buildFightDom,reward:rReward,dead:rDead,win:rWin,challenger:rChallenger})[ui.screen]();
  if(ui.screen==='fight')bindFight();
  if(ui.screen==='home')ladPaint();
  if(ui.screen!==ui.last){window.scrollTo(0,0);ui.last=ui.screen}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b.dataset.v)});
load();render();ladInit();
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',kkLoad);else setTimeout(kkLoad,0);
</script>
